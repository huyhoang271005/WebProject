name: Auto copy folders to main

on:
  push:
    branches-ignore:
      - main
      - tung

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-folders:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source branch
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Determine folders
      - name: Determine sync folders
        id: folders
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH" = "huy" ]; then
            echo "folders=orders contact checkout product-detail payment" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "nhat" ]; then
            echo "folders=products-manager feedback" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "tung" ]; then
            echo "folders=session home navbar products notification" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "thanh" ]; then
            echo "folders= catalog-management cart order-manager" >> $GITHUB_OUTPUT
          else
            echo "folders=" >> $GITHUB_OUTPUT
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # 3. Stop if no folders
      - name: Stop if no folders
        if: steps.folders.outputs.folders == ''
        run: |
          echo "No folders configured for branch ${{ steps.folders.outputs.branch }} — stopping."
          exit 0

      # 4. Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 5. Fetch and checkout main
      - name: Fetch main branch
        run: |
          git fetch origin main:main

      # 6. Copy folders to main
      - name: Copy folders to main
        run: |
          SRC_BRANCH=${{ steps.folders.outputs.branch }}

          # Checkout main
          git checkout main

          # Copy each folder from source branch
          for F in ${{ steps.folders.outputs.folders }}; do
            echo "Syncing folder: $F"
            rm -rf "$F"
            git checkout $SRC_BRANCH -- "$F" || echo "Folder $F not found in $SRC_BRANCH"
          done

      # 7. Commit and push changes
      - name: Commit and push
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit — skipping"
            exit 0
          fi

          SRC_BRANCH=${{ steps.folders.outputs.branch }}
          FOLDERS="${{ steps.folders.outputs.folders }}"

          git commit -m "Auto sync folders ($FOLDERS) from $SRC_BRANCH"
          git push origin main
