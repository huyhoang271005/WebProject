<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - Tạp Hóa Xanh</title>

    <link rel="stylesheet" href="/dialog/index.css" />
    <link rel="stylesheet" href="/lib/public.css" />
    <link rel="stylesheet" href="/cart/cart.css">

    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
</head>

<body>


    <div class="cart-container">
        <!-- LEFT PART: CART ITEMS -->
        <div class="section-box cart-items-section">
            <!-- HEADER: SELECT ALL (DESKTOP) -->
            <div class="cart-header-main">
                <div class="checkbox-wrap">
                    <input type="checkbox" id="checkAll" class="item-checkbox" onchange="toggleAll(this)">
                    <label for="checkAll" style="cursor: pointer; user-select: none;">Sản phẩm trong giỏ (<span
                            id="count-display">0</span>)</label>
                </div>

                <div class="delete-selected" onclick="deleteSelected()" style="display: none;">
                    <i class="fa-solid fa-trash-can"></i> Xóa
                </div>
            </div>

            <!-- PRODUCT LIST -->
            <div id="cartList">
                <div style="text-align: center; padding: 40px; color: #888;">
                    <i class="fas fa-spinner fa-spin"></i> Đang tải giỏ hàng...
                </div>
            </div>
        </div>

        <!-- RIGHT PART: SUMMARY -->
        <div class="summary-box">
            <!-- Mobile Select All Injection Point (via JS or CSS trick if needed, but lets keep it simple) -->
            <div class="mobile-select-all" style="display: none;"> <!-- Shown by media query -->
                <input type="checkbox" id="checkAllMobile" class="item-checkbox" onchange="toggleAll(this)">
                <label for="checkAllMobile">Tất cả</label>
            </div>

            <div class="summary-header">Thanh toán</div>

            <div class="summary-row">
                <span>Tạm tính:</span>
                <span class="total-price-display">0₫</span>
            </div>

            <div class="summary-total">
                <span>Tổng tiền:</span>
                <span class="total-price-display">0₫</span>
            </div>

            <button class="checkout-btn">Mua hàng (0)</button>
        </div>
    </div>

    <script type="module" src="/cart/index.js"></script>
</body>

</html>
