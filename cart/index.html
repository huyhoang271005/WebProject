<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - Tạp Hóa Xanh</title>

    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <link rel="stylesheet" href="cart.css">

    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="cart-container">
        <div class="section-box cart-items-section">
            <div class="cart-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="checkAll" class="item-checkbox" onchange="toggleAll(this)">
                    <label for="checkAll" style="cursor: pointer; user-select: none;">Chọn tất cả (<span
                            id="count-display">0</span>)</label>
                </div>

                <div class="delete-selected" onclick="deleteSelected()"
                    style="cursor: pointer; color: #ee4d2d; font-size: 0.9rem; display: none;">
                    <i class="fa-solid fa-trash-can"></i> Xóa đã chọn
                </div>
            </div>

            <div id="cartList">
                <div style="text-align: center; padding: 20px; color: #666;">
                    <i class="fas fa-spinner fa-spin"></i> Đang tải giỏ hàng...
                </div>
            </div>
        </div>

        <div class="summary-box">
            <div class="cart-header">
                <i class="fa-solid fa-receipt" style="color: #10B981;"></i> Chi tiết đơn hàng
            </div>

            <div class="summary-row">
                <span>Tổng giá trị sản phẩm:</span>
                <span class="total-price" style="font-weight: 500;">0₫</span>
            </div>

            <div class="summary-total">
                <span>Tổng thanh toán:</span>
                <span class="total-price">0₫</span>
            </div>

            <button class="checkout-btn">Mua hàng (0)</button>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
