<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/public.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="loadPage"></div>
<div id="info" style="display:none">
    <main class="checkout-container">
        <header class="checkout-header">
            <h1>Xác nhận thanh toán</h1>
            <p>Vui lòng kiểm tra kỹ thông tin đơn hàng của bạn</p>
        </header>

        <div class="checkout-grid">
            <div class="checkout-main">
                <section class="card-section">
                    <div class="card-title"><i class="fas fa-map-marker-alt"></i> Địa chỉ giao hàng</div>
                    <div id="listAddress"></div>
                    <a href="../contact/index.html" class="manage-address-link">+ Quản lý địa chỉ</a>
                </section>

                <section class="card-section">
                    <div class="card-title"><i class="fas fa-credit-card"></i> Phương thức thanh toán</div>
                    <div class="payment-methods-grid">
                        <label class="payment-method-card">
                            <input type="radio" name="paymentType" value="VN_PAY" checked>
                            <div class="payment-card-content">
                                <i class="fa-solid fa-building-columns"></i>
                                <span>Thanh toán VNPay</span>
                            </div>
                        </label>
                        <label class="payment-method-card">
                            <input type="radio" name="paymentType" value="COD">
                            <div class="payment-card-content">
                                <i class="fa-solid fa-hand-holding-dollar"></i>
                                <span>Thanh toán COD</span>
                            </div>
                        </label>
                    </div>
                </section>
            </div>

            <aside class="checkout-sidebar">
            <section class="card-section summary-card">
                <div class="card-title"><i class="fas fa-shopping-bag"></i> TÓM TẮT ĐƠN HÀNG</div>
                <div id="listOrderItems">
                </div>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="total-row">
                    <span>Tổng cộng:</span>
                    <span id="txtTotalPrice">0đ</span>
                </div>
                <button id="btnConfirmOrder" class="btn-checkout">Xác nhận thanh toán</button>
            </section>
        </aside>
    </main>
</div>
<script type="module" src="index.js"></script>
</body>
</html>
