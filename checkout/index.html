<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../lib/public.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/checkout/index.css">
</head>
<body>
<div id="loadPage"></div>
<div id="info" style="display:none">
    <main class="checkout-container">
        <header class="checkout-header">
            <h1><i class="fas fa-shopping-bag"></i> Xác nhận đơn hàng</h1>
            <p>Vui lòng kiểm tra kỹ thông tin đơn hàng của bạn</p>
        </header>

        <div class="checkout-grid">
            <div class="checkout-main">
                <section class="card-section">
                    <div class="card-title">
                        <i class="fas fa-map-marker-alt"></i> Địa chỉ giao hàng
                    </div>
                    <div id="listAddress"></div>
                    
                    <!-- Empty State cho địa chỉ -->
                    <div id="emptyAddressState" class="empty-state-checkout" style="display: none;">
                        <i class="fas fa-map-marked-alt"></i>
                        <h3>Chưa có địa chỉ giao hàng</h3>
                        <p>Vui lòng thêm địa chỉ để tiếp tục đặt hàng</p>
                        <a href="../contact/index.html" class="btn-add-address">
                            <i class="fas fa-plus-circle"></i> Thêm địa chỉ
                        </a>
                    </div>
                    
                    <a href="../contact/index.html" class="manage-address-link" id="manageAddressLink">
                        <i class="fas fa-cog"></i> Quản lý địa chỉ
                    </a>
                </section>

                <section class="card-section">
                    <div class="card-title">
                        <i class="fas fa-credit-card"></i> Phương thức thanh toán
                    </div>
                    <div class="payment-methods-grid">
                        <label class="payment-method-card">
                            <input type="radio" name="paymentType" value="VN_PAY" checked>
                            <div class="payment-card-content">
                                <i class="fa-solid fa-building-columns"></i>
                                <span>VNPay</span>
                                <small>Thanh toán qua ngân hàng</small>
                            </div>
                        </label>
                        <label class="payment-method-card">
                            <input type="radio" name="paymentType" value="COD">
                            <div class="payment-card-content">
                                <i class="fa-solid fa-hand-holding-dollar"></i>
                                <span>COD</span>
                                <small>Thanh toán khi nhận hàng</small>
                            </div>
                        </label>
                    </div>
                </section>
            </div>

            <aside class="checkout-sidebar">
                <section class="card-section summary-card">
                    <div class="card-title">
                        <i class="fas fa-shopping-bag"></i> TÓM TẮT ĐƠN HÀNG
                    </div>
                    <div id="listOrderItems"></div>
                    <div class="total-row">
                        <span>Tổng cộng:</span>
                        <span id="txtTotalPrice">0₫</span>
                    </div>
                    <button id="btnConfirmOrder" class="btn-checkout">
                        <span class="btn-text">Đặt hàng ngay</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> Đang xử lý...
                        </span>
                    </button>
                    <div class="checkout-security">
                        <i class="fas fa-shield-alt"></i> Giao dịch an toàn & bảo mật
                    </div>
                </section>
            </aside>
        </div>
    </main>
</div>
<script type="module" src="/checkout/index.js"></script>
</body>
</html>
