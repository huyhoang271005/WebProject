<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Địa chỉ Giao hàng</title>
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./contact.css">
</head>
<body>

<div id="loadPage"></div>

<div id="info" style="display: none;">
    <header>
        <h1>Quản lý Địa chỉ Giao hàng</h1>
    </header>

    <main class="contact-container">
        <section class="add-address-section">
            <h2>Thêm/Sửa Địa chỉ</h2>
            <form id="addressForm">
                <input type="hidden" id="contactId" name="contactId">

                <div class="form-group">
                    <label for="contact_name">Họ và Tên:</label>
                    <input type="text" id="contact_name" name="contact_name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="address">Địa chỉ chi tiết (VD: Số nhà, tên đường, Phường, Quận, Tỉnh):</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <button type="submit" id="saveAddressBtn" class="primary-btn">Lưu Địa Chỉ</button>
                <button type="button" id="cancelEditBtn" class="secondary-btn" style="display: none;">Hủy Bỏ</button>
            </form>
        </section>

        <section class="list-address-section">
            <h2>Địa chỉ Của Bạn</h2>
            <div id="addressList">
                <p class="no-address-message">Bạn chưa có địa chỉ nào được lưu.</p>
            </div>
        </section>
    </main>
</div>

<script type="module" src="../public/api.js"></script>
<script type="module" src="./contact.js"></script>
</body>
</html>
