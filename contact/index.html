<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Địa chỉ Giao hàng</title>
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/contact/index.css">
</head>
<body>
<div id="notification" class="hidden"></div>
<div id="loadPage"></div>

<div id="info" style="display: none;">
    <div class="container">
        <header>
            <h1><i class="fa fa-map-marker-alt"></i> Quản lý Địa chỉ Giao hàng</h1>
            <p class="subtitle">Quản lý địa chỉ nhận hàng của bạn một cách dễ dàng</p>
        </header>

        <main class="contact-container">
            <!-- Form thêm/sửa -->
            <section class="add-address-section">
                <div class="section-header">
                    <h2>
                        <i class="fa fa-edit"></i>
                        <span id="formTitle">Thêm Địa chỉ Mới</span>
                    </h2>
                </div>

                <form id="addressForm">
                    <input type="hidden" id="contactId" name="contactId">

                    <div class="form-group">
                        <label for="contact_name">
                            <i class="fa fa-user"></i> Họ và Tên <span class="required">*</span>
                        </label>
                        <input type="text" id="contact_name" name="contact_name"
                               placeholder="Nhập họ và tên người nhận" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            <i class="fa fa-phone"></i> Số điện thoại <span class="required">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="Nhập số điện thoại liên hệ" required>
                    </div>

                    <div class="form-group">
                        <label for="address">
                            <i class="fa fa-map-marker-alt"></i> Địa chỉ chi tiết <span class="required">*</span>
                        </label>
                        <input type="text" id="address" name="address"
                               placeholder="Số nhà, tên đường, Phường/Xã, Quận/Huyện, Tỉnh/TP" required>
                    </div>

                    <div class="btn-group">
                        <button type="submit" id="saveAddressBtn" class="primary-btn">
                            <i class="fa fa-save"></i>
                            <span id="saveBtnText">Lưu Địa chỉ</span>
                        </button>
                        <button type="button" id="cancelEditBtn" class="secondary-btn" style="display: none;">
                            <i class="fa fa-times"></i>
                            Hủy bỏ
                        </button>
                    </div>
                </form>
            </section>

            <!-- Danh sách địa chỉ -->
            <section class="list-address-section">
                <div class="section-header">
                    <h2>
                        <i class="fa fa-list"></i>
                        Danh sách Địa chỉ
                        <span id="addressCount" class="count-badge"></span>
                    </h2>
                </div>

                <div id="addressList">
                    <p class="no-address-message">Đang tải danh sách địa chỉ...</p>
                </div>
            </section>
        </main>
    </div>
</div>

<script type="module" src="/contact/index.js"></script>
</body>
</html>
