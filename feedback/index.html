<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá sản phẩm - HCMUTE Shop</title>
    <link rel="stylesheet" href="/feedback/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="feedback-container">
        <!-- Header -->
        <header class="feedback-header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="title">Đánh giá sản phẩm</h1>
                    <p class="subtitle">Chia sẻ trải nghiệm của bạn về sản phẩm đã mua</p>
                </div>
            </div>
        </header>

        <!-- Search Section -->
        <div class="search-section" style="display: none;">
            <div class="search-card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Tìm đơn hàng
                    </h3>
                </div>
                <div class="card-body">
                    <div class="search-group">
                        <div class="input-wrapper">
                            <label for="orderIdInput">Order ID <span class="required">*</span></label>
                            <input type="text" class="input" id="orderIdInput" placeholder="Nhập Order ID (UUID)">
                        </div>
                        <button type="button" class="btn btn-primary" id="btnSearch">
                            <i class="fa-solid fa-search"></i>
                            Tìm kiếm
                        </button>
                    </div>
                    <div id="searchResult" class="search-result" style="display: none;">
                        <i class="fa-solid fa-circle-info"></i>
                        <span id="searchResultText"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Section -->
        <div class="products-section" id="productsSection" style="display: none;">
            <div class="section-header">
                <h2>Sản phẩm có thể đánh giá</h2>
            </div>
            <div class="products-container" id="productsContainer">
                <!-- Product cards will be inserted here -->
            </div>
        </div>

        <!-- Feedback Form -->
        <div class="feedback-section" id="feedbackSection" style="display: none;">
            <div class="feedback-card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fa-solid fa-star"></i>
                        Đánh giá của bạn
                    </h3>
                </div>
                <div class="card-body">
                    <div class="selected-product" id="selectedProductInfo">
                        <!-- Selected product info -->
                    </div>

                    <div class="form-group">
                        <label>Đánh giá <span class="required">*</span></label>
                        <div class="star-rating" id="starRating">
                            <i class="fa-regular fa-star" data-rating="1"></i>
                            <i class="fa-regular fa-star" data-rating="2"></i>
                            <i class="fa-regular fa-star" data-rating="3"></i>
                            <i class="fa-regular fa-star" data-rating="4"></i>
                            <i class="fa-regular fa-star" data-rating="5"></i>
                        </div>
                        <p class="rating-text" id="ratingText">Chọn số sao để đánh giá</p>
                    </div>

                    <div class="form-group">
                        <label for="commentInput">Nhận xét (không bắt buộc)</label>
                        <textarea class="textarea" id="commentInput" rows="5"
                            placeholder="Chia sẻ trải nghiệm của bạn về sản phẩm này..."></textarea>
                        <p class="hint">Nhận xét chi tiết sẽ giúp người mua khác có thêm thông tin tham khảo</p>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnClear">
                            <i class="fa-solid fa-xmark"></i>
                            Hủy
                        </button>
                        <button type="button" class="btn btn-primary" id="btnSubmit">
                            <i class="fa-solid fa-paper-plane"></i>
                            Gửi đánh giá
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/feedback/index.js"></script>
</body>

</html>
