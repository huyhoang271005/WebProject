<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp Hóa Xanh - Trang Chủ</title>

    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />

    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* --- [QUAN TRỌNG] FIX LỖI VỠ GIAO DIỆN --- */
      /* Đoạn này ghi đè lên public.css để web không bị co rúm vào giữa */
      html,
      body {
        display: block !important; /* Trả lại bố cục dòng bình thường */
        width: 100% !important;
        height: auto !important; /* Cho phép chiều cao tự động để cuộn */
        min-height: 100vh;
        overflow-y: auto !important; /* Bắt buộc bật thanh cuộn dọc */
        background-color: #f3f4f6 !important; /* Màu nền xám nhẹ dịu mắt */
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Segoe UI", sans-serif;
      }

      /* Đẩy nội dung xuống để không bị Navbar che mất (Navbar cao 70px) */
      .main-container {
        padding-top: 80px;
        padding-bottom: 50px;
        max-width: 1400px; /* Giới hạn chiều rộng cho đẹp trên màn hình to */
        margin: 0 auto; /* Căn giữa khung nội dung */
      }

      /* --- BANNER --- */
      .hero {
        margin: 20px 30px;
        border-radius: 16px;
        overflow: hidden;
        height: 350px;
        position: relative;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.7);
      }
      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 60px;
        color: white;
      }
      .hero h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      }
      .hero button {
        padding: 12px 35px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 30px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1.1rem;
        transition: 0.2s;
        width: fit-content;
      }
      .hero button:hover {
        transform: translateY(-3px);
        background: #059669;
      }

      /* --- PRODUCT GRID --- */
      .category-section {
        background: white;
        margin: 30px 30px;
        padding: 25px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f3f4f6;
        align-items: center;
      }
      .section-title {
        font-size: 1.4rem;
        font-weight: 800;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-see-more {
        text-decoration: none;
        color: #10b981;
        border: 2px solid #10b981;
        padding: 6px 20px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.9rem;
        transition: 0.2s;
      }
      .btn-see-more:hover {
        background: #10b981;
        color: white;
      }

      .product-grid-5 {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
      /* Responsive cho Grid */
      @media (max-width: 1200px) {
        .product-grid-5 {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 992px) {
        .product-grid-5 {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 768px) {
        .product-grid-5 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .product-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        transition: 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        border-color: #10b981;
      }
      .p-img {
        width: 100%;
        height: 160px;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: #ccc;
      }
      .p-info {
        padding: 12px;
      }
      .p-name {
        font-weight: 600;
        color: #374151;
        font-size: 0.95rem;
        margin-bottom: 5px;
        height: 40px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.4;
      }
      .p-price {
        color: #ef4444;
        font-weight: bold;
        font-size: 1.1rem;
      }

      /* --- NAV SEARCH & DROPDOWN (Cho phần HTML Inject từ JS) --- */
      .nav-cat-btn {
        background: white;
        border: 1px solid #e5e7eb;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        color: #374151;
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
      }
      .cat-dropdown {
        position: absolute;
        top: 110%;
        left: 0;
        background: white;
        width: 220px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #eee;
        z-index: 1001;
      }
      .cat-dropdown.show {
        display: flex;
      }
      .cat-dropdown a {
        padding: 12px 15px;
        text-decoration: none;
        color: #333;
        border-bottom: 1px solid #f9f9f9;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .cat-dropdown a:hover {
        background: #ecfdf5;
        color: #10b981;
        padding-left: 20px;
      }

      .nav-search-input {
        width: 400px;
        padding: 10px 40px 10px 20px;
        border: 2px solid #e5e7eb;
        border-radius: 25px;
        outline: none;
      }
      .nav-search-input:focus {
        border-color: #10b981;
      }

      /* --- ADMIN TOOLBAR --- */
      .admin-toolbar {
        background: white;
        margin: 20px 30px;
        padding: 15px;
        border-radius: 12px;
        border-left: 5px solid #f59e0b;
        display: flex;
        gap: 15px;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .admin-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
      }
      .admin-btn {
        background: #f59e0b;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .admin-only {
        display: none !important;
      }

      /* --- LOADING SPINNER --- */
      #loadingOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #ecfdf5;
        border-top: 5px solid #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* --- CHAT & TOAST --- */
      .chat-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background: #3b82f6;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        border: 3px solid white;
        transition: 0.2s;
      }
      .chat-btn:hover {
        transform: scale(1.1);
      }

      #toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999; /* Đưa lên top để dễ nhìn */
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>

  <body>
    <div id="loadingOverlay"><div class="spinner"></div></div>

    <div class="main-container">
      <div class="admin-toolbar admin-only" id="adminTool">
        <strong style="color: #b45309"
          ><i class="fa-solid fa-bullhorn"></i> Admin Broadcast:</strong
        >
        <input
          type="text"
          id="message"
          class="admin-input"
          placeholder="Nhập thông báo gửi toàn hệ thống..."
        />
        <button id="sendAll" class="admin-btn">Gửi</button>
      </div>

      <div class="hero">
        <img
          src="https://img.freepik.com/free-photo/assortment-various-barbecue-food-grill_23-2148243673.jpg?w=1380"
          alt="Banner"
        />
        <div class="hero-overlay">
          <h1>Siêu Sale Tạp Hóa 🍡</h1>
          <p>Giảm giá 50% tất cả các loại đồ ăn vặt!</p>
          <button
            onclick="window.location.href='../products/index.html?cat=an-vat'"
          >
            Mua Ngay
          </button>
        </div>
      </div>

      <div id="homeContainer"></div>
    </div>

    <div class="chat-btn" onclick="alert('Tính năng Chat đang phát triển!')">
      <i class="fa-solid fa-comments"></i>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="index.js"></script>
  </body>
</html>
