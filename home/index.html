<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp Hóa Xanh - Trang Chủ</title>

    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />

    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* --- FIX LỖI VỠ GIAO DIỆN & MÀU NỀN --- */
      * {
        box-sizing: border-box; /* Quan trọng: Giúp padding không làm vỡ khung */
      }

      html,
      body {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100vh;
        overflow-y: auto !important;

        /* --- THAY MÀU NỀN TẠI ĐÂY --- */
        /* Cách 1: Dùng ảnh mây trời (giống Tempest) */
        background: url("https://img.freepik.com/free-vector/blue-sky-with-clouds-background_1017-26302.jpg")
          no-repeat center center fixed !important;
        background-size: cover !important;
        /* Cách 2: Hoặc dùng Gradient Xanh Ngọc (Nếu sợ ảnh load chậm) - Bro thích cái nào thì bỏ comment cái đó */
        /* background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%) !important; */

        margin: 0 !important;
        padding: 0 !important;
        font-family: "Segoe UI", sans-serif;
      }

      /* Đẩy nội dung xuống để không bị Navbar che mất */
      .main-container {
        padding-top: 90px; /* Tăng lên chút cho thoáng (Navbar 70px + 20px hở) */
        padding-bottom: 50px;
        max-width: 1200px; /* Co lại 1200px nhìn cho sang, 1400px hơi loãng */
        margin: 0 auto;
      }

      /* --- BANNER (Đã chỉnh lại ảnh) --- */
      .hero {
        margin: 0 20px 30px 20px; /* Cách lề 2 bên 20px */
        border-radius: 20px;
        overflow: hidden;
        height: 380px; /* Tăng chiều cao xíu cho đẹp */
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Bóng đổ xịn hơn */
      }
      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* [QUAN TRỌNG] Căn chỉnh ảnh để không bị cắt mất đầu ông người mẫu */
        object-position: center 25%;
        filter: brightness(0.8); /* Tăng tối lên chút để chữ nổi hơn */
      }
      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 80px; /* Đẩy chữ vào sâu hơn tí */
        color: white;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0) 60%
        ); /* Làm nền chữ rõ hơn */
      }
      .hero h1 {
        font-size: 3.5rem;
        margin-bottom: 15px;
        font-weight: 800;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        line-height: 1.2;
      }
      .hero p {
        font-size: 1.2rem;
        margin-bottom: 25px;
        opacity: 0.9;
      }
      .hero button {
        padding: 15px 40px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1.1rem;
        transition: 0.3s;
        width: fit-content;
        box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
      }
      .hero button:hover {
        transform: translateY(-3px);
        background: #059669;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.6);
      }

      /* --- PRODUCT GRID --- */
      .category-section {
        background: white;
        margin: 0 20px 40px 20px;
        padding: 30px;
        border-radius: 20px;
        border: 1px solid #f0f0f0;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02); /* Bóng nhẹ tinh tế */
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #f3f4f6;
        align-items: center;
      }
      .section-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: #111827;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .btn-see-more {
        text-decoration: none;
        color: #10b981;
        padding: 8px 20px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: 0.2s;
        background: #ecfdf5;
      }
      .btn-see-more:hover {
        background: #10b981;
        color: white;
      }

      .product-grid-5 {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 25px;
      }

      /* Responsive */
      @media (max-width: 1200px) {
        .product-grid-5 {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 992px) {
        .product-grid-5 {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 768px) {
        .product-grid-5 {
          grid-template-columns: repeat(2, 1fr);
        }
        .hero h1 {
          font-size: 2rem;
        }
        .hero {
          height: 300px;
        }
      }

      .product-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        transition: 0.3s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        border-color: #10b981;
      }
      .p-img {
        width: 100%;
        height: 180px;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: #e5e7eb;
        transition: 0.3s;
      }
      .product-card:hover .p-img {
        background: #f0fdf4;
        color: #10b981;
      }

      .p-info {
        padding: 15px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .p-name {
        font-weight: 600;
        color: #374151;
        font-size: 1rem;
        margin-bottom: 8px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 44px;
      }
      .p-price {
        color: #ef4444;
        font-weight: 700;
        font-size: 1.1rem;
        margin-top: auto;
      }

      /* --- NAV SEARCH & DROPDOWN --- */
      .nav-cat-btn {
        background: white;
        border: 1px solid #e5e7eb;
        padding: 8px 18px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 600;
        color: #374151;
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
        transition: 0.2s;
      }
      .nav-cat-btn:hover {
        border-color: #10b981;
        color: #10b981;
      }

      .cat-dropdown {
        position: absolute;
        top: 120%;
        left: 0;
        background: white;
        width: 240px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #f3f4f6;
        z-index: 1001;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .cat-dropdown.show {
        display: flex;
      }
      .cat-dropdown a {
        padding: 14px 20px;
        text-decoration: none;
        color: #4b5563;
        border-bottom: 1px solid #f9f9f9;
        display: flex;
        gap: 12px;
        align-items: center;
        transition: 0.2s;
      }
      .cat-dropdown a:hover {
        background: #ecfdf5;
        color: #10b981;
        padding-left: 25px;
      }

      .nav-search-input {
        width: 450px;
        padding: 10px 45px 10px 20px;
        border: 1px solid #e5e7eb;
        border-radius: 50px;
        outline: none;
        background: #f9fafb;
        transition: 0.2s;
      }
      .nav-search-input:focus {
        border-color: #10b981;
        background: white;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }

      /* ... (Giữ nguyên phần Admin Toolbar, Spinner, Chat, Toast cũ) ... */
      /* Copy lại phần Admin Toolbar, Spinner, ChatBtn từ code cũ của bro vào dưới đây nếu muốn giữ */
      .admin-toolbar {
        background: white;
        margin: 0 20px 20px 20px;
        padding: 15px;
        border-radius: 12px;
        border-left: 5px solid #f59e0b;
        display: flex;
        gap: 15px;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .admin-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
      }
      .admin-btn {
        background: #f59e0b;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .admin-only {
        display: none !important;
      }

      #loadingOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #ecfdf5;
        border-top: 5px solid #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .chat-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background: #3b82f6;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        border: 3px solid white;
        transition: 0.2s;
      }
      .chat-btn:hover {
        transform: scale(1.1);
      }
      #toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>

  <body>
    <div id="loadingOverlay"><div class="spinner"></div></div>

    <div class="main-container">
      <div class="admin-toolbar admin-only" id="adminTool">
        <strong style="color: #b45309"
          ><i class="fa-solid fa-bullhorn"></i> Admin Broadcast:</strong
        >
        <input
          type="text"
          id="message"
          class="admin-input"
          placeholder="Nhập thông báo gửi toàn hệ thống..."
        />
        <button id="sendAll" class="admin-btn">Gửi</button>
      </div>

      <div class="hero">
        <img
          src="https://img.freepik.com/free-photo/assortment-various-barbecue-food-grill_23-2148243673.jpg?w=1380"
          alt="Banner"
        />
        <div class="hero-overlay">
          <h1>Siêu Sale Tạp Hóa 🍡</h1>
          <p>Giảm giá 50% tất cả các loại đồ ăn vặt!</p>
          <button
            onclick="window.location.href='../products/index.html?cat=an-vat'"
          >
            Mua Ngay
          </button>
        </div>
      </div>

      <div id="homeContainer"></div>
    </div>

    <div class="chat-btn" onclick="alert('Tính năng Chat đang phát triển!')">
      <i class="fa-solid fa-comments"></i>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="index.js"></script>
  </body>
</html>
