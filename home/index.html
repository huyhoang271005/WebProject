<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Chủ - Tạp Hóa Xanh</title>

    <link rel="stylesheet" href="../dialog/index.css" />

    <link rel="stylesheet" href="../public/public.css" />

    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* Reset cơ bản */
      body,
      html {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: #f5f5f5;
        font-family: "Segoe UI", sans-serif;
      }

      /* KHUNG BAO BỌC CHÍNH (Căn giữa, giới hạn chiều rộng 1200px giống Shopee) */
      .main-container {
        max-width: 1200px;
        margin: 0 auto; /* Căn giữa màn hình */
        padding: 20px 10px; /* Khoảng cách lề */
        min-height: 80vh;
      }

      /* --- CSS BANNER CAROUSEL --- */
      .banner-section {
        width: 100%;
        margin-bottom: 25px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        background: #fff;
      }

      .banner-container {
        position: relative;
        width: 100%;
        /* Tỷ lệ khung hình 2.5:1 (Banner dài ngang) */
        padding-top: 40%;
        background: #e0e0e0;
      }

      /* Trên màn hình to thì giới hạn chiều cao banner lại cho đỡ chiếm chỗ */
      @media (min-width: 992px) {
        .banner-container {
          padding-top: 0;
          height: 350px;
        }
      }

      .banner-slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .banner-slide.active {
        opacity: 1;
        z-index: 1;
      }

      .banner-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Nếu ảnh bị cắt thì đổi thành object-fit: contain; */
      }

      /* Nút điều hướng banner (nếu cần) */
      .banner-dots {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 2;
      }
      .dot {
        width: 10px;
        height: 10px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        cursor: pointer;
        transition: 0.3s;
      }
      .dot.active {
        background: #fff;
        transform: scale(1.2);
      }

      /* --- RESPONSIVE MOBILE --- */
      @media (max-width: 768px) {
        .main-container {
          padding: 10px 5px;
          margin-top: 20px;
        } /* Cách navbar ra */
        .banner-section {
          border-radius: 0;
          margin-bottom: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="banner-section">
        <div class="banner-container" id="homeBannerSlider">
          <div class="banner-slide active">
            <img
              src="https://img.freepik.com/free-vector/flat-supermarket-twitch-banner_23-2149361816.jpg?w=1380"
              alt="Sale 1"
            />
          </div>
          <div class="banner-slide">
            <img
              src="https://img.freepik.com/free-vector/flat-supermarket-sale-banner_23-2149369125.jpg?w=1380"
              alt="Sale 2"
            />
          </div>
          <div class="banner-slide">
            <img
              src="https://img.freepik.com/free-psd/horizontal-banner-online-fashion-sale_23-2148585443.jpg?w=1380"
              alt="Sale 3"
            />
          </div>

          <div class="banner-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>

      <div id="homeContainer">
        <div style="text-align: center; padding: 50px; color: #999">
          <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...
        </div>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
