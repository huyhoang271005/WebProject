<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cuộc trò chuyện</title>
    <link rel="stylesheet" href="/lib/public.css" />
    <link rel="stylesheet" href="/message/index.css" />
    <link rel="stylesheet" href="/dialog/index.css" />
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="chat-container" id="chatContainer">
        <div class="room-list" id="roomList">
        </div>

        <div class="chat-content">

            <div id="chatHeader" class="chat-header hidden">
                <button id="backBtn" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="chat-user">
                    <img id="chatAvatar" class="chat-avatar" src="" alt="" />
                    <span id="chatUsername" class="chat-username"></span>
                    <span id = "chatRoleName" style="font-size: 0.65rem; color: #6b7280; border: 1px solid #d1d5db; padding: 1px 5px; border-radius: 8px; margin-left: 4px;"></span>
                </div>
            </div>

            <div id="chatMessages" class="chat-messages hidden">
            </div>

            <div id="chatInput" class="chat-input hidden">
                <input type="text" placeholder="Nhập tin nhắn..." id="messageInput" />
                <button id="sendBtn">➤</button>
            </div>

            <div id="chatEmpty" class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <p>Chọn một cuộc trò chuyện để bắt đầu</p>
            </div>

        </div>
    </div>

    <script src="/message/index.js" type="module"></script>
</body>

</html>
