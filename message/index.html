<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cuộc trò chuyện</title>
    <link rel="stylesheet" href="/lib/public.css" />
    <link rel="stylesheet" href="/message/index.css" />
    <link rel="stylesheet" href="/dialog/index.css" />
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="chat-container" id="chatContainer">
        <div class="room-list" id="roomList">
        </div>

        <div class="chat-content">

            <div id="chatHeader" class="chat-header hidden">
                <button id="backBtn" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="chat-user">
                    <img id="chatAvatar" class="chat-avatar" src="" alt="" />
                    <span id="chatUsername" class="chat-username"></span>
                    <span id = "chatRoleName" style="font-size: 0.65rem; color: #6b7280; border: 1px solid #d1d5db; padding: 1px 5px; border-radius: 8px; margin-left: 4px;"></span>
                </div>
            </div>

            <div id="chatMessages" class="chat-messages hidden">
            </div>

            <div id="chatInput" class="chat-input hidden">
                <div class="chat-actions">
                    <button id="btnOrderLink" title="Gắn Đơn hàng" style="margin-top: 0"><i class="fa-solid fa-box"></i></button>
                    <button id="btnProductLink" title="Gắn Sản phẩm" style="margin-top: 0"><i class="fa-solid fa-tag"></i></button>
                </div>
                <input type="text" placeholder="Nhập tin nhắn..." id="messageInput" />
                <button id="sendBtn">➤</button>
            </div>

            <div id="chatEmpty" class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <p>Chọn một cuộc trò chuyện để bắt đầu</p>
            </div>

        </div>
    </div>
    <!-- Search Link Modal -->
    <div id="linkSearchModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-height: 80vh; max-width: 500px; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h2 id="linkSearchTitle"><i class="fa-solid fa-search"></i> Tìm kiếm</h2>
                <button class="modal-close" onclick="document.getElementById('linkSearchModal').style.display='none'">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div class="modal-body" style="flex: 1; overflow-y: auto; padding: 20px;">
                <div class="search-bar" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div style="flex: 1; position: relative;">
                        <input type="text" id="linkSearchInput" placeholder="Nhập từ khóa..." style="width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px;">
                    </div>
                    <button id="linkSearchBtn" style="padding: 0 15px; margin: 10px 0; background: var(--primary-green, #10b981); color: white; border: none; border-radius: 8px; cursor: pointer;">
                        Tìm
                    </button>
                </div>
                <div id="linkSearchResult" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Kết quả load vào đây -->
                </div>
            </div>
        </div>
    </div>

    <script src="/message/index.js" type="module"></script>
</body>

</html>
