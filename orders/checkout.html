<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán</title>
    <link rel="stylesheet" href="checkout.css">
    <script src="checkout.js"></script>
</head>
<body>
<div class="overlay-address" id="popup">
    <div class="modal">
        <div class="modal-header">
            <h2>Địa chỉ mới</h2>
            <p>Để đặt hàng, vui lòng thêm địa chỉ nhận hàng</p>
        </div>

        <div class="modal-body">
            <div class="form-group two">
                <input type="text" placeholder="Họ và tên">
                <input type="text" placeholder="Số điện thoại">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Địa chỉ cụ thể">
            </div>
        </div>

        <div class="modal-footer">
            <button class="back-btn" onclick="closePopup()">Trở Lại</button>
            <button class="submit-btn">Hoàn thành</button>
        </div>
    </div>
</div>

<div class=""></div>

</body>
</html>
