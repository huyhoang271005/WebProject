<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Tạp hóa Xanh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared Styles (Public) -->
    <link rel="stylesheet" href="../lib/public.css">

    <!-- Local Styles -->
    <link rel="stylesheet" href="index.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="container my-4" style="max-width: 1400px;">

        <!-- ========== HEADER WITH TABS ========== -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-primary fw-bold mb-1">Quản Lý Sản Phẩm</h1>
                <p class="text-muted mb-0">Quản lý kho hàng và giá cả</p>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-success" id="btnTabAdd">
                    <i class="bi bi-plus-circle me-2"></i>Thêm Sản Phẩm
                </button>
                <button type="button" class="btn btn-outline-primary" id="btnTabEdit">
                    <i class="bi bi-pencil-square me-2"></i>Sửa / Xóa Sản Phẩm
                </button>
            </div>
        </div>

        <!-- ========== ADD PRODUCT VIEW ========== -->
        <div id="addView" class="view-container">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-plus-circle text-success me-2"></i>Thêm Sản Phẩm Mới
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form id="productForm">
                        <div class="row">
                            <!-- LEFT: INFO & VARIANTS -->
                            <div class="col-lg-8">
                                <!-- Basic Info -->
                                <div class="card shadow-sm border-0 mb-4">
                                    <div class="card-body p-4">
                                        <h5 class="card-title fw-bold text-uppercase text-muted mb-3 small">Thông tin chung</h5>
                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Tên sản phẩm <span
                                                    class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="productName" required
                                                placeholder="VD: Áo thun nam...">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Mô tả</label>
                                            <textarea class="form-control" id="description" rows="4"
                                                placeholder="Mô tả chi tiết sản phẩm..."></textarea>
                                        </div>
                                    </div>
                                </div>

                                <!-- Variants -->
                                <div class="card shadow-sm border-0 mb-4">
                                    <div class="card-body p-4">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h5 class="card-title fw-bold text-uppercase text-muted mb-0 small">Phân loại hàng
                                            </h5>
                                            <div>
                                                <button type="button" class="btn btn-outline-primary btn-sm me-2"
                                                    id="btnAddAttr">
                                                    <i class="bi bi-plus-lg"></i> Thêm thuộc tính
                                                </button>
                                                <button type="button" class="btn btn-success btn-sm text-white"
                                                    id="btnGenerateVariants">
                                                    <i class="bi bi-lightning-charge-fill"></i> Tạo biến thể
                                                </button>
                                            </div>
                                        </div>
                                        <div id="attributesContainer" class="mb-3"></div>
                                        <div id="variantsContainer"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- RIGHT: IMAGES, PRICE, CATEGORY -->
                            <div class="col-lg-4">
                                <!-- Image & Prices -->
                                <div class="card shadow-sm border-0 mb-4">
                                    <div class="card-body p-4">
                                        <h5 class="card-title fw-bold text-uppercase text-muted mb-3 small">Ảnh & Giá</h5>

                                        <div class="mb-4 text-center group-image-upload">
                                            <div class="position-relative d-inline-block w-100">
                                                <div id="mainImagePreview"
                                                    class="border rounded bg-light d-flex align-items-center justify-content-center"
                                                    style="height: 250px; overflow: hidden; background-color: #f8f9fa;">
                                                    <div class="text-center text-muted">
                                                        <i class="bi bi-image fs-1 d-block mb-2"></i>
                                                        <small>Chưa có ảnh</small>
                                                    </div>
                                                </div>
                                                <label for="mainImage"
                                                    class="btn btn-primary rounded-circle position-absolute bottom-0 end-0 m-3 shadow"
                                                    style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                                                    <i class="bi bi-camera-fill"></i>
                                                </label>
                                            </div>
                                            <input type="file" class="d-none" id="mainImage" accept="image/*">
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Giá gốc (VNĐ)</label>
                                            <input type="number" class="form-control" id="priceOriginal" min="0" step="1000"
                                                required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Giá bán (VNĐ)</label>
                                            <input type="number" class="form-control" id="price" min="0" step="1000" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Organization -->
                                <div class="card shadow-sm border-0 mb-4">
                                    <div class="card-body p-4">
                                        <h5 class="card-title fw-bold text-uppercase text-muted mb-3 small">Phân loại</h5>
                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Danh mục</label>
                                            <select class="form-select" id="categoryId" required>
                                                <option value="">-- Chọn danh mục --</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-medium">Thương hiệu</label>
                                            <select class="form-select" id="brandId" required>
                                                <option value="">-- Chọn thương hiệu --</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- Actions -->
                                <div class="card shadow-sm border-0 bg-transparent">
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btnSubmit">
                                            <span class="spinner-border spinner-border-sm d-none me-2"
                                                id="submitSpinner"></span>
                                            <span id="submitBtnText">Lưu Sản Phẩm</span>
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" id="btnReset">Làm Mới
                                            Form</button>
                                        <button type="button" class="btn btn-outline-danger d-none" id="btnDelete">
                                            <i class="bi bi-trash me-2"></i>Xóa Sản Phẩm Này
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ========== EDIT/DELETE PRODUCT VIEW ========== -->
        <div id="editView" class="view-container d-none">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square text-primary me-2"></i>Sửa / Xóa Sản Phẩm
                    </h5>
                </div>
                <div class="card-body p-4">
                    <div class="row justify-content-center">
                        <div class="col-md-8 col-lg-6">
                            <div class="text-center mb-4">
                                <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
                                <h5 class="fw-bold mb-2">Tìm kiếm sản phẩm</h5>
                                <p class="text-muted">Nhập ID sản phẩm để tìm và chỉnh sửa</p>
                            </div>
                            <form id="searchProductForm">
                                <div class="input-group input-group-lg mb-3">
                                    <input type="text" class="form-control" id="searchProductInput" 
                                        placeholder="Nhập ID sản phẩm..." required>
                                    <button class="btn btn-primary" type="submit" id="btnSearchProduct">
                                        <i class="bi bi-search me-2"></i>Tìm kiếm
                                    </button>
                                </div>
                            </form>
                            <div id="searchResult" class="mt-4"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>

</html>
