<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Tạp hóa Xanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">Thêm Sản Phẩm Mới</h2>
                
                <form id="productForm">
                    <!-- Thông tin cơ bản -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Thông tin cơ bản</h5>
                            
                            <div class="mb-3">
                                <label for="productName" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="productName" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea class="form-control" id="description" rows="4"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="mainImage" class="form-label">Ảnh chính sản phẩm</label>
                                <input type="file" class="form-control" id="mainImage" accept="image/*">
                                <div id="mainImagePreview" class="mt-2"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="priceOriginal" class="form-label">Giá gốc <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="priceOriginal" min="0" step="1000" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">Giá bán <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="price" min="0" step="1000" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="categoryId" class="form-label">Danh mục</label>
                                    <div id="categoryWrapper">
                                        <select class="form-select" id="categoryId"></select>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="brandId" class="form-label">Thương hiệu</label>
                                    <div id="brandWrapper">
                                        <select class="form-select" id="brandId"></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Thuộc tính biến thể -->
                    <div id="attributesContainer" class="mb-4"></div>

                    <!-- Bảng variants -->
                    <div id="variantsContainer" class="mb-4"></div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
                            Tạo sản phẩm
                        </button>
                        <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
