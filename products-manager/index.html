<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm</title>
    <link rel="stylesheet" href="../dialog/index.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="container">
            <!-- Main Card -->
            <div class="card">
                <h2 id="pageTitle">Thêm mới Sản phẩm</h2>

                <!-- VIEW: ADD -->
                <div id="viewAdd">
                    <div class="form-container">
                        <h3>Thông tin cơ bản</h3>

                        <div class="form-group" style="text-align: center; margin-bottom: 20px;">
                            <div class="image-upload-box" id="mainImageContainer"
                                style="width: 150px; height: 150px; border: 2px dashed #ccc; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; background: #fff;">
                                <img id="mainImagePreview" src=""
                                    style="width: 100%; height: 100%; object-fit: cover; display: none;">
                                <div id="mainImagePlaceholder" style="text-align: center; color: #888;">
                                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px;"></i><br>
                                    <span style="font-size: 12px;">Ảnh chính</span>
                                </div>
                                <input type="file" id="mainImageInput" accept="image/*"
                                    style="opacity: 0; position: absolute; top:0; left:0; width:100%; height:100%; cursor: pointer;">
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label>Tên sản phẩm <span class="required">*</span></label>
                                <input type="text" id="productName" placeholder="Nhập tên sản phẩm...">
                            </div>
                            <div class="form-group">
                                <label>Danh mục <span class="required">*</span></label>
                                <select id="categoryId">
                                    <option value="">-- Chọn danh mục --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Thương hiệu <span class="required">*</span></label>
                                <select id="brandId">
                                    <option value="">-- Chọn thương hiệu --</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Mô tả</label>
                            <textarea id="description" rows="3" placeholder="Mô tả sản phẩm..."></textarea>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label>Giá gốc <span class="required">*</span></label>
                                <input type="number" id="originalPrice" placeholder="0">
                            </div>
                            <div class="form-group">
                                <label>Giá bán <span class="required">*</span></label>
                                <input type="number" id="price" placeholder="0">
                            </div>
                        </div>

                        <hr>

                        <h3>Thuộc tính & Biến thể</h3>
                        <div id="attributesSection">
                            <!-- Dynamic Attributes will be added here -->
                        </div>

                        <button id="btnAddAttribute" class="secondary-btn"><i class="fa-solid fa-plus"></i> Thêm thuộc
                            tính</button>

                        <div class="variants-wrapper" style="margin-top: 20px;">
                            <h4>Danh sách biến thể</h4>
                            <table id="variantsTable">
                                <thead>
                                    <tr>
                                        <th>Ảnh</th>
                                        <th>Biến thể</th>
                                        <th>Giá gốc</th>
                                        <th>Giá bán</th>
                                        <th>Kho</th>
                                        <th>Xóa</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Generated Variants -->
                                </tbody>
                            </table>
                        </div>

                        <div class="form-actions">
                            <button id="btnCancel" class="secondary-btn">Hủy</button>
                            <button id="btnSave" class="primary-btn">Lưu sản phẩm</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="index.js"></script>
        <script type="module">
            import { loadNavbar } from '../navbar/navbar.js';
            loadNavbar({});
        </script>
</body>

</html>
