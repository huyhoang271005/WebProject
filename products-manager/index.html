<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Tạp hóa Xanh</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/lib/public.css">

    <!-- Local Styles -->
    <link rel="stylesheet" href="/products-manager/index.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navbar will be injected here by navbar.js -->

    <div class="app-wrapper">

        <!-- Header / Breadcrumbs -->
        <div class="app-header">
            <h1 class="page-heading">Thêm Sản Phẩm Mới</h1>
            <div class="app-actions">
                <button type="button" class="btn-text" id="btnCancel">Hủy bỏ</button>
                <button type="button" class="btn-primary" id="btnSave">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Sản Phẩm
                </button>
            </div>
        </div>

        <div id="addView" class="view-container">
            <form id="productForm" class="layout-v2">

                <!-- MAIN COLUMN -->
                <div class="col-main">

                    <!-- 1. General Info -->
                    <div class="panel">
                        <div class="panel-header">Thông tin chung</div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="label">Tên sản phẩm <span class="req">*</span></label>
                                <input type="text" class="input-field" id="productName" required
                                    placeholder="VD: Bánh quy bơ Danisa...">
                            </div>
                            <div class="form-group">
                                <label class="label">Mô tả</label>
                                <textarea class="input-field" id="description" rows="6"
                                    placeholder="Mô tả chi tiết sản phẩm..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Pricing & Stock -->
                    <div class="panel">
                        <div class="panel-header">Giá & Kho hàng</div>
                        <div class="panel-body">
                            <div class="row-group">
                                <div class="form-group half">
                                    <label class="label">Giá bán <span class="req">*</span></label>
                                    <input type="number" class="input-field" id="price" required min="0" step="1000">
                                </div>
                                <div class="form-group half">
                                    <label class="label">Giá gốc</label>
                                    <input type="number" class="input-field" id="originalPrice" min="0" step="1000">
                                </div>
                            </div>
                            <div class="row-group">
                                <div class="form-group half">
                                    <label class="label">Tồn kho <span class="req">*</span></label>
                                    <input type="number" class="input-field" id="stock" required min="0">
                                </div>
                                <div class="form-group half">
                                    <label class="label">Đơn vị tính</label>
                                    <input type="text" class="input-field" placeholder="VD: Hộp, Cái..." disabled
                                        style="background:#f9fafb;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Variants -->
                    <div class="panel">
                        <div class="panel-header-action">
                            <span>Phân loại hàng (Biến thể)</span>
                            <button type="button" class="btn-small" id="btnAddAttribute">
                                <i class="fa-solid fa-plus"></i> Thêm nhóm phân loại
                            </button>
                        </div>
                        <div class="panel-body">
                            <div id="attributesSection" class="attributes-wrapper"></div>

                            <div class="variants-table-wrapper">
                                <table class="custom-table" id="variantsTable">
                                    <thead>
                                        <tr>
                                            <th width="60">Ảnh</th>
                                            <th>Tên biến thể</th>
                                            <th width="120">Giá gốc</th>
                                            <th width="120">Giá bán</th>
                                            <th width="80">Kho</th>
                                            <th width="40"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="variantsTableBody"></tbody>
                                </table>
                                <div id="variantsEmptyState" class="empty-state">
                                    Chưa có biến thể nào được tạo.
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- SIDEBAR -->
                <div class="col-sidebar">

                    <!-- Organization -->
                    <div class="panel">
                        <div class="panel-header">Tổ chức</div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="label">Danh mục <span class="req">*</span></label>
                                <select class="input-field" id="categoryId" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Thương hiệu <span class="req">*</span></label>
                                <select class="input-field" id="brandId" required>
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Media -->
                    <div class="panel">
                        <div class="panel-header">Ảnh đại diện</div>
                        <div class="panel-body">
                            <div class="media-upload-area" id="mainImageArea">
                                <div class="upload-content" id="mainImagePlaceholder">
                                    <i class="fa-regular fa-image"></i>
                                    <span>Thêm ảnh</span>
                                </div>
                                <img id="mainImagePreview" src="" class="preview-img" style="display:none;">
                                <input type="file" id="mainImageInput" hidden accept="image/*">
                            </div>
                        </div>
                    </div>

                </div>

            </form>
        </div>

    </div>

    <!-- Dialog container if needed, but dialog.js appends to body -->

    <script type="module" src="/products-manager/index.js"></script>
</body>

</html>
