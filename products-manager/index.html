<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Tạp hóa Xanh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/lib/public.css">

    <!-- Local Styles -->
    <link rel="stylesheet" href="/products-manager/index.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="main-container">

        <!-- ========== PAGE HEADER ========== -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Quản Lý Sản Phẩm</h1>
                <p class="page-subtitle">Quản lý kho hàng, giá cả và biến thể sản phẩm</p>
            </div>
            <div class="btn-group" role="group" style="display:flex; gap:10px;">
                <button type="button" class="btn btn-primary" id="btnTabAdd">
                    <i class="bi bi-plus-circle"></i> Thêm Mới
                </button>
                <button type="button" class="btn btn-secondary" id="btnTabEdit">
                    <i class="bi bi-pencil-square"></i> Sửa / Xóa
                </button>
            </div>
        </div>

        <!-- ========== VIEW: ADD PRODUCT ========== -->
        <div id="addView" class="view-container">
            <form id="productForm">
                <div class="layout-grid">

                    <!-- LEFT COLUMN -->
                    <div class="left-col">
                        <!-- General Info -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Thông tin chung</h3>
                            </div>
                            <div class="card-body">
                                <div class="form-group mb-4">
                                    <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="productName" required
                                        placeholder="VD: Áo thun Cotton 100%...">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Mô tả sản phẩm</label>
                                    <textarea class="form-control" id="description" rows="5"
                                        placeholder="Mô tả chi tiết, đặc điểm nổi bật..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Variants -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Phân loại & Biến thể</h3>
                                <button type="button" class="btn btn-sm btn-secondary" id="btnAddAttribute">
                                    <i class="bi bi-plus-lg"></i> Thêm thuộc tính
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="attributesSection" class="mb-4"></div>

                                <div class="table-responsive">
                                    <table class="table" id="variantsTable">
                                        <thead>
                                            <tr>
                                                <th style="width: 80px;">Ảnh</th>
                                                <th>Biến thể</th>
                                                <th style="width: 140px;">Giá gốc</th>
                                                <th style="width: 140px;">Giá bán</th>
                                                <th style="width: 100px;">Kho</th>
                                                <th style="width: 50px;"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Rows generated by JS -->
                                        </tbody>
                                        <tfoot id="tableEmptyState" style="display:none;">
                                            <tr>
                                                <td colspan="6" class="text-center py-4 text-muted">
                                                    Chưa có biến thể nào được tạo. Thêm thuộc tính để bắt đầu.
                                                </td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN -->
                    <div class="right-col">
                        <!-- Media -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Ảnh đại diện</h3>
                            </div>
                            <div class="card-body">
                                <label for="mainImageInput" class="image-upload-area">
                                    <img id="mainImagePreview" src="" style="display: none;">
                                    <div id="mainImagePlaceholder" class="upload-placeholder">
                                        <i class="bi bi-cloud-upload upload-icon"></i>
                                        <div>Kéo thả hoặc click để tải lên</div>
                                    </div>
                                    <input type="file" class="d-none" id="mainImageInput" accept="image/*">
                                </label>
                            </div>
                        </div>

                        <!-- Pricing & Organization -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Giá & Kho hàng</h3>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Giá gốc (VNĐ)</label>
                                    <input type="number" class="form-control" id="originalPrice" min="0" step="1000"
                                        placeholder="0">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="price" min="0" step="1000" required
                                        placeholder="0">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tồn kho <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="stock" min="0" required
                                        placeholder="0">
                                </div>
                            </div>
                        </div>

                        <!-- Organization -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Phân loại</h3>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                                    <select class="form-select" id="categoryId" required>
                                        <option value="">-- Chọn danh mục --</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Thương hiệu <span class="text-danger">*</span></label>
                                    <select class="form-select" id="brandId" required>
                                        <option value="">-- Chọn thương hiệu --</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- STICKY ACTIONS BAR -->
                <div class="sticky-actions">
                    <button type="button" class="btn btn-secondary" id="btnCancel">Hủy bỏ</button>
                    <button type="button" class="btn btn-primary" id="btnSave">
                        <i class="bi bi-check-lg"></i> Lưu sản phẩm
                    </button>
                </div>
            </form>
        </div>

        <!-- ========== VIEW: EDIT/SEARCH ========== -->
        <div id="editView" class="view-container d-none">
            <div class="card">
                <div class="card-body text-center py-5">
                    <div style="max-width: 500px; margin: 0 auto;">
                        <i class="bi bi-search"
                            style="font-size: 3rem; color: #E5E7EB; display: block; margin-bottom: 16px;"></i>
                        <h3 style="margin-bottom: 8px;">Tìm kiếm sản phẩm</h3>
                        <p class="text-muted mb-4">Nhập ID sản phẩm để chỉnh sửa hoặc xóa</p>

                        <form id="searchProductForm" class="d-flex gap-2">
                            <input type="text" class="form-control" id="searchProductInput"
                                placeholder="Nhập ID sản phẩm..." required>
                            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                        </form>
                        <div id="searchResult" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="/products-manager/index.js"></script>
</body>

</html>
