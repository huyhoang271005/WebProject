<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp Hóa Xanh - Sản phẩm</title>

    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* 1. RESET CSS */
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100vh !important;
        background-color: #f3f4f6 !important;
        font-family: "Segoe UI", sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* 2. LAYOUT */
      .main-container {
        margin-top: 70px;
        height: calc(100vh - 70px);
        width: 100%;
        display: flex;
        align-items: flex-start;
      }

      /* 3. SIDEBAR */
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: white;
        border-right: 1px solid #e5e7eb;
        padding: 20px;
        height: 100%;
        overflow-y: auto;
      }
      .filter-group {
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid #f3f4f6;
      }
      .filter-title {
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        gap: 8px;
      }
      .cat-item {
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        color: #555;
        display: flex;
        justify-content: space-between;
        transition: 0.2s;
      }
      .cat-item:hover {
        background: #f3f4f6;
        color: #10b981;
      }
      .cat-item.active {
        background: #ecfdf5;
        color: #10b981;
        font-weight: bold;
      }
      .mini-search,
      .price-input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
      }
      .btn-filter {
        width: 100%;
        background: #10b981;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }

      /* 4. CONTENT AREA */
      .content-area {
        flex: 1;
        padding: 20px 30px;
        background: #f3f4f6;
        height: 100%;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      /* Banner nhỏ */
      .shop-banner {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #10b981, #3b82f6);
        display: flex;
        align-items: center;
        padding: 0 40px;
        color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .shop-banner h2 {
        margin: 0 0 5px 0;
        font-size: 2rem;
      }

      /* >>> HEADER BLOCK (Sắp xếp + Phân trang) <<< */
      .header-block {
        background: white;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        padding: 15px 20px;
      }

      /* Hàng 1: Tiêu đề + Sort */
      .header-row-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f3f4f6;
        padding-bottom: 15px;
        margin-bottom: 15px;
      }
      .page-title {
        font-size: 1.2rem;
        font-weight: 800;
        text-transform: uppercase;
        color: #111;
      }
      .sort-select {
        padding: 6px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
        cursor: pointer;
      }

      /* Hàng 2: Phân trang (Top) */
      .header-row-bottom {
        display: flex;
        justify-content: center;
      }

      /* STYLE NÚT PHÂN TRANG (Vuông vắn) */
      .pagination {
        display: flex;
        gap: 5px;
      }
      .page-btn {
        width: 32px;
        height: 32px;
        border: 1px solid #e5e7eb;
        background: white;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: 600;
        color: #555;
        transition: 0.2s;
        user-select: none;
      }
      .page-btn:hover {
        border-color: #10b981;
        color: #10b981;
      }
      .page-btn.active {
        background: #10b981;
        color: white;
        border-color: #10b981;
      }
      .page-btn.disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      /* Bottom Pagination (Căn giữa) */
      .pagination-container-bottom {
        display: flex;
        justify-content: center;
        margin-top: 30px;
        padding-bottom: 50px;
      }

      /* GRID SẢN PHẨM */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 20px;
      }
      .product-card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        transition: 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        border-color: #10b981;
      }
      .p-img {
        width: 100%;
        height: 170px;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #ccc;
      }
      .p-body {
        padding: 12px;
      }
      .p-name {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 5px;
        height: 40px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.4;
      }
      .p-price {
        color: #ef4444;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .btn-buy-now {
        width: 100%;
        background: #10b981;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 4px;
        margin-top: 10px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-buy-now:hover {
        background: #059669;
      }

      /* Style cho Navbar Custom (Copy từ Home sang) */
      .nav-cat-btn {
        background: white;
        border: 1px solid #e5e7eb;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        color: #374151;
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
      }
      .cat-dropdown {
        position: absolute;
        top: 110%;
        left: 0;
        background: white;
        width: 220px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #eee;
      }
      .cat-dropdown.show {
        display: flex;
      }
      .cat-dropdown a {
        padding: 12px 15px;
        text-decoration: none;
        color: #333;
        border-bottom: 1px solid #f9f9f9;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .cat-dropdown a:hover {
        background: #ecfdf5;
        color: #10b981;
        padding-left: 20px;
      }

      .nav-search-input {
        width: 400px;
        padding: 10px 40px 10px 20px;
        border: 2px solid #e5e7eb;
        border-radius: 25px;
        outline: none;
      }
      .nav-search-input:focus {
        border-color: #10b981;
      }
      .nav-icon-link {
        color: #4b5563;
        font-size: 1.4rem;
        position: relative;
        margin-left: 10px;
        text-decoration: none;
      }
      .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ef4444;
        color: white;
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 10px;
        border: 2px solid white;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <aside class="sidebar">
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-filter"></i> Tìm nhanh
          </div>
          <input
            type="text"
            id="sidebarSearch"
            class="mini-search"
            placeholder="Lọc tên..."
          />
        </div>

        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-layer-group"></i> Danh mục
          </div>
          <ul class="cat-list" id="catFilterList"></ul>
        </div>

        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-money-bill-wave"></i> Giá tiền
          </div>
          <div style="display: flex; gap: 5px">
            <input
              type="number"
              id="priceFrom"
              class="price-input"
              placeholder="Từ"
            />
            <input
              type="number"
              id="priceTo"
              class="price-input"
              placeholder="Đến"
            />
          </div>
          <button class="btn-filter" id="btnFilterPrice">Áp dụng</button>
        </div>
      </aside>

      <main class="content-area">
        <div class="shop-banner">
          <div>
            <h2>Thế Giới Đồ Ăn Vặt 🍟</h2>
            <p>Săn deal hời, ăn chơi thả ga!</p>
          </div>
        </div>

        <div class="header-block">
          <div class="header-row-top">
            <div class="page-title" id="pageTitle">TẤT CẢ SẢN PHẨM</div>
            <div style="display: flex; align-items: center; gap: 10px">
              <span>Sắp xếp:</span>
              <select class="sort-select" id="sortSelect">
                <option value="newest">Mới nhất</option>
                <option value="price_asc">Giá: Thấp đến Cao</option>
                <option value="price_desc">Giá: Cao đến Thấp</option>
              </select>
            </div>
          </div>

          <div class="header-row-bottom">
            <div class="pagination" id="paginationTop"></div>
          </div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="pagination-container-bottom">
          <div class="pagination" id="paginationBottom"></div>
        </div>
      </main>
    </div>

    <div
      style="
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background: #3b82f6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      "
    >
      <i class="fa-solid fa-comments"></i>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
