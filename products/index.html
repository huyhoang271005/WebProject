<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Sách Sản Phẩm - Tạp Hóa Xanh</title>
    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* ... (Các phần body, main-container giữ nguyên) ... */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        display: block !important;
        width: 100% !important;
        min-height: 100vh;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; /* Font kiểu Shopee */
        background: #f5f5f5 !important; /* Nền xám nhạt dịu mắt */
      }

      .main-container {
        padding-top: 20px;
        padding-bottom: 50px;
        width: 1200px;
        max-width: 100%;
        margin: 0 auto;
        display: flex;
        gap: 20px;
      }

      /* Sidebar & Search giữ nguyên như bản cũ đã fix */
      .sidebar {
        width: 230px;
        flex-shrink: 0;
        background: white;
        border-radius: 4px;
        padding: 15px;
        height: fit-content;
        position: sticky;
        top: 90px;
      }
      /* ... (Code CSS sidebar giữ nguyên) ... */

      /* [UPDATE] GRID 6 CỘT CHUẨN SHOPEE */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
      }

      /* Responsive */
      @media (max-width: 1200px) {
        .product-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .main-container {
          width: 100%;
          padding: 10px;
        }
      }
      @media (max-width: 992px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .sidebar {
          display: none;
        }
      }
      @media (max-width: 600px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* [NEW] STYLE THẺ SẢN PHẨM GIỐNG SHOPEE */
      .product-card {
        background: white;
        border: 1px solid transparent; /* Viền trong suốt */
        border-radius: 2px; /* Bo góc cực nhẹ */
        overflow: hidden;
        transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .product-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-color: #ee4d2d; /* Viền cam khi hover */
        z-index: 2;
      }

      /* Ảnh vuông 1:1 */
      .p-img {
        width: 100%;
        padding-top: 100%; /* Kỹ thuật tạo khung vuông 1:1 */
        position: relative;
        background: #f9f9f9;
      }
      .p-img img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Hoặc contain tùy ảnh */
      }

      .p-info {
        padding: 8px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .p-name {
        font-size: 0.85rem;
        color: #333;
        line-height: 1.25rem;
        margin-bottom: 5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 2.5rem; /* Giữ khung tên luôn 2 dòng */
      }

      .p-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto; /* Đẩy xuống đáy */
      }

      /* Rating nhỏ xíu */
      .p-rating {
        font-size: 0.6rem;
        color: #ffce3d;
      }
      .p-sold {
        font-size: 0.7rem;
        color: #757575;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <aside class="sidebar">
        <div class="filter-group">
          <div class="filter-title">Tìm nhanh</div>
          <div class="sidebar-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              type="text"
              id="sidebarSearch"
              placeholder="Gõ tên món..."
              style="
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
              "
            />
          </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 15px 0" />
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-bars-staggered"></i> Danh mục
          </div>
          <ul class="cat-list" id="catFilterList">
            <li class="cat-item active">
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải...
            </li>
          </ul>
        </div>
      </aside>

      <div class="product-content">
        <div class="page-header">
          <div class="ph-title" id="pageTitle">Tất cả sản phẩm</div>
          <div class="ph-sort">
            <span style="color: #666; margin-right: 5px; font-size: 0.85rem"
              >Sắp xếp:</span
            >
            <select>
              <option>Mới nhất</option>
              <option>Giá tăng dần</option>
              <option>Giá giảm dần</option>
            </select>
          </div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="pagination-wrapper">
          <div id="pagination" class="pagination-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
