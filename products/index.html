<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Sách Sản Phẩm - Tạp Hóa Xanh</title>
    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100vh;
        overflow-y: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Segoe UI", sans-serif;
        background: url("https://img.freepik.com/free-vector/blue-sky-with-clouds-background_1017-26302.jpg")
          no-repeat center center fixed !important;
        background-size: cover !important;
      }

      /* [ĐÃ SỬA] Padding-top nhỏ lại */
      .main-container {
        padding-top: 20px;
        padding-bottom: 50px;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 30px;
        padding-left: 20px;
        padding-right: 20px;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: white;
        border-radius: 16px;
        padding: 20px;
        height: fit-content;
        position: sticky;
        top: 90px; /* Cách đỉnh 90px để không bị navbar che khi cuộn */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #f3f4f6;
        z-index: 10;
      }
      .filter-group {
        margin-bottom: 25px;
      }
      .filter-title {
        font-weight: 800;
        font-size: 1.1rem;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #111827;
      }
      .cat-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .cat-item {
        padding: 12px 15px;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.2s;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #4b5563;
        font-weight: 600;
        user-select: none;
      }
      .cat-item:hover {
        background: #f3f4f6;
        color: #10b981;
        transform: translateX(5px);
      }
      .cat-item.active {
        background: #ecfdf5;
        color: #10b981;
        font-weight: 800;
        border-left: 4px solid #10b981;
      }
      .price-range input {
        width: 100%;
        margin-bottom: 10px;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        outline: none;
      }
      .btn-apply {
        width: 100%;
        background: #10b981;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
      }
      .btn-apply:hover {
        background: #059669;
      }

      .product-content {
        flex: 1;
        min-width: 0;
      }
      .page-header {
        background: white;
        padding: 20px 30px;
        border-radius: 16px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #f3f4f6;
      }
      .ph-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: #111827;
      }
      .ph-sort select {
        padding: 8px 15px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        outline: none;
        cursor: pointer;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .product-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        transition: 0.3s;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        border-color: #10b981;
      }
      .p-img {
        width: 100%;
        height: 200px;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #f0f0f0;
        overflow: hidden;
      }
      .p-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: 0.3s;
      }
      .product-card:hover .p-img img {
        transform: scale(1.05);
      }
      .p-info {
        padding: 15px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .p-name {
        font-weight: 600;
        color: #374151;
        font-size: 1rem;
        margin-bottom: 10px;
        line-height: 1.4;
        height: 44px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .p-price {
        color: #ef4444;
        font-weight: 700;
        font-size: 1.2rem;
        margin-top: auto;
        margin-bottom: 15px;
      }
      .btn-add-cart {
        width: 100%;
        padding: 10px;
        border: 1px solid #10b981;
        color: #10b981;
        background: white;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-add-cart:hover {
        background: #10b981;
        color: white;
      }

      @media (max-width: 992px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .sidebar {
          display: none;
        }
        .main-container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <aside class="sidebar">
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-layer-group"></i> Danh mục
          </div>
          <ul class="cat-list" id="catFilterList">
            <li class="cat-item active" onclick="changeCategory(null, this)">
              Đang tải...
            </li>
          </ul>
        </div>
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-filter-circle-dollar"></i> Khoảng giá
          </div>
          <div class="price-range">
            <input
              type="number"
              placeholder="Giá thấp nhất (VNĐ)"
              id="minPrice"
            />
            <input
              type="number"
              placeholder="Giá cao nhất (VNĐ)"
              id="maxPrice"
            />
            <button class="btn-apply">Áp dụng</button>
          </div>
        </div>
      </aside>
      <div class="product-content">
        <div class="page-header">
          <div class="ph-title" id="pageTitle">Tất cả sản phẩm</div>
          <div class="ph-sort">
            <i
              class="fa-solid fa-arrow-down-short-wide"
              style="color: #666; margin-right: 5px"
            ></i>
            Sắp xếp:
            <select>
              <option>Mới nhất</option>
              <option>Giá tăng dần</option>
              <option>Giá giảm dần</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
