<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Sách Sản Phẩm - Tạp Hóa Xanh</title>
    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100vh;
        overflow-y: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Segoe UI", sans-serif;
        background: url("https://img.freepik.com/free-vector/blue-sky-with-clouds-background_1017-26302.jpg")
          no-repeat center center fixed !important;
        background-size: cover !important;
      }

      .main-container {
        padding-top: 20px;
        padding-bottom: 50px;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        padding-left: 20px;
        padding-right: 20px;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: white;
        border-radius: 12px;
        padding: 20px;
        height: fit-content;
        position: sticky;
        top: 90px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        border: 1px solid #f0f0f0;
        z-index: 10;
      }

      .filter-group {
        margin-bottom: 20px;
      }
      .filter-title {
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #1f2937;
        text-transform: uppercase;
      }

      .sidebar-search-box {
        position: relative;
        width: 100%;
        box-sizing: border-box; /* Quan trọng */
      }
      .sidebar-search-box input {
        width: 100% !important; /* Ép chiều rộng bằng thẻ cha */
        max-width: 100%; /* Không cho phép tràn */
        padding: 10px 15px 10px 35px; /* Chừa chỗ cho icon bên trái */
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        outline: none;
        font-size: 0.9rem;
        background: #f9fafb;
        transition: 0.2s;
        box-sizing: border-box !important; /* Tính cả padding vào chiều rộng */
      }
      .sidebar-search-box input:focus {
        background: white;
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      }
      .sidebar-search-box i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 0.9rem;
        pointer-events: none; /* Để bấm xuyên qua icon vào input */
      }

      .cat-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .cat-item {
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 6px;
        transition: 0.2s;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #4b5563;
        font-weight: 500;
        user-select: none;
        font-size: 0.95rem;
      }
      .cat-item:hover {
        background: #f3f4f6;
        color: #10b981;
      }
      .cat-item.active {
        background: #ecfdf5;
        color: #10b981;
        font-weight: 700;
      }

      .product-content {
        flex: 1;
        min-width: 0;
      }
      .page-header {
        background: white;
        padding: 15px 25px;
        border-radius: 12px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        border: 1px solid #f0f0f0;
      }
      .ph-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: #111827;
      }
      .ph-sort select {
        padding: 8px 15px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        outline: none;
        cursor: pointer;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      @media (max-width: 1200px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 992px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .sidebar {
          display: none;
        }
        .main-container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <aside class="sidebar">
        <div class="filter-group">
          <div class="filter-title">Tìm nhanh</div>
          <div class="sidebar-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="sidebarSearch" placeholder="Gõ tên món..." />
          </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 15px 0" />
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-bars-staggered"></i> Danh mục
          </div>
          <ul class="cat-list" id="catFilterList">
            <li class="cat-item active">
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải...
            </li>
          </ul>
        </div>
      </aside>

      <div class="product-content">
        <div class="page-header">
          <div class="ph-title" id="pageTitle">Tất cả sản phẩm</div>
          <div class="ph-sort">
            <span style="color: #666; margin-right: 5px">Sắp xếp:</span>
            <select>
              <option>Mới nhất</option>
              <option>Giá tăng dần</option>
              <option>Giá giảm dần</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
