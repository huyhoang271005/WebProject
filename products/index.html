<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Sách Sản Phẩm - Tạp Hóa Xanh</title>
    <link rel="stylesheet" href="../dialog/index.css" />
    <link rel="stylesheet" href="../public/public.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        display: block !important;
        width: 100% !important;
        min-height: 100vh;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Segoe UI", sans-serif;
        background: url("https://img.freepik.com/free-vector/blue-sky-with-clouds-background_1017-26302.jpg")
          no-repeat center center fixed !important;
        background-size: cover !important;
      }

      .main-container {
        padding-top: 20px;
        padding-bottom: 50px;
        width: 95%;
        max-width: 1500px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: white;
        border-radius: 8px;
        padding: 20px;
        position: sticky;
        top: 90px;
        height: fit-content;
        min-height: 60vh;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #f0f0f0;
        z-index: 10;
      }
      .filter-group {
        margin-bottom: 25px;
      }
      .filter-title {
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #1f2937;
        text-transform: uppercase;
      }

      .sidebar-search-box {
        position: relative;
        width: 100%;
      }
      .sidebar-search-box input {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100%;
        padding: 10px 10px 10px 35px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        outline: none;
        font-size: 0.95rem;
        background: #f9fafb;
        transition: 0.2s;
        box-sizing: border-box !important;
      }
      .sidebar-search-box input:focus {
        background: white;
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      }
      .sidebar-search-box i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        pointer-events: none;
      }

      .cat-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .cat-item {
        padding: 12px 15px;
        cursor: pointer;
        border-radius: 6px;
        transition: 0.2s;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #4b5563;
        font-weight: 500;
        user-select: none;
        font-size: 0.95rem;
      }
      .cat-item:hover {
        background: #f3f4f6;
        color: #10b981;
      }
      .cat-item.active {
        background: #ecfdf5;
        color: #10b981;
        font-weight: 700;
      }

      .product-content {
        flex: 1;
        min-width: 0;
      }
      .page-header {
        background: white;
        padding: 15px 25px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #f0f0f0;
      }
      .ph-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: #111827;
      }
      .ph-sort select {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        outline: none;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      @media (max-width: 1400px) {
        .product-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 1100px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 992px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .sidebar {
          display: none;
        }
        .main-container {
          width: 100%;
          padding: 10px;
        }
      }
      @media (max-width: 600px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .product-card {
        background: white;
        border: 1px solid transparent;
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.1s, box-shadow 0.1s;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .product-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-color: #ee4d2d;
        z-index: 2;
      }
      .p-img {
        width: 100%;
        padding-top: 100%;
        position: relative;
        background: #fff;
      }
      .p-img img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .p-info {
        padding: 10px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .p-name {
        font-size: 0.95rem;
        color: #333;
        line-height: 1.3rem;
        margin-bottom: 5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.6rem;
      }
      .p-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
      }
      .p-rating {
        font-size: 0.75rem;
        color: #ffce3d;
      }
      .p-sold {
        font-size: 0.8rem;
        color: #757575;
      }

      .pagination-wrapper {
        margin-top: 30px;
        display: flex;
        justify-content: center;
      }
      .pagination-container {
        display: flex;
        gap: 5px;
        background: white;
        padding: 5px 10px;
        border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .page-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.2s;
        color: #333;
      }
      .page-btn:hover:not(.disabled) {
        color: #10b981;
        background: #ecfdf5;
      }
      .page-btn.active {
        background: #10b981;
        color: white;
      }
      .page-btn.disabled {
        opacity: 0.3;
        cursor: default;
      }
      .page-dots {
        padding: 0 5px;
        color: #9ca3af;
        line-height: 32px;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <aside class="sidebar">
        <div class="filter-group">
          <div class="filter-title">Tìm nhanh</div>
          <div class="sidebar-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="sidebarSearch"
              placeholder="Gõ tên món..."
              style="
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
              "
            />
          </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #f3f4f6; margin: 15px 0" />
        <div class="filter-group">
          <div class="filter-title">
            <i class="fa-solid fa-bars-staggered"></i> Danh mục
          </div>
          <ul class="cat-list" id="catFilterList">
            <li class="cat-item active">
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải...
            </li>
          </ul>
        </div>
      </aside>

      <div class="product-content">
        <div class="page-header">
          <div class="ph-title" id="pageTitle">Tất cả sản phẩm</div>
          <div class="ph-sort">
            <span style="color: #666; margin-right: 5px; font-size: 0.9rem"
              >Sắp xếp:</span
            >
            <select>
              <option>Mới nhất</option>
              <option>Giá tăng dần</option>
              <option>Giá giảm dần</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div class="pagination-wrapper">
          <div id="pagination" class="pagination-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
