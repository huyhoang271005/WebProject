<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hồ sơ cá nhân - Tạp Hóa Xanh</title>
  <link rel="stylesheet" href="../dialog/index.css" />
  <link rel="stylesheet" href="/lib/public.css" />
  <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

  <style>
    /* --- CSS PROFILE --- */
    /* Override public.css min-width */
    input,
    select {
      min-width: 0 !important;
    }

    * {
      box-sizing: border-box;
    }

    /* Container chính */
    .profile-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      /* Cách navbar (80px) + khoảng hở (40px) = 120px */
      padding: 40px 20px;
    }

    /* Card bao quanh */
    .card-profile {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header của Card */
    .card-header {
      padding: 20px 30px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #111827;
      font-weight: 700;
    }

    .card-body {
      padding: 40px;
    }

    /* Layout 2 cột: Avatar (Trái) - Info (Phải) */
    .profile-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 50px;
    }

    /* CỘT TRÁI: AVATAR */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }

    .avatar-img:hover {
      transform: scale(1.02);
    }

    .btn-change-avatar {
      margin-top: 5px;
      cursor: pointer;
      background: #ecfdf5;
      color: #10b981;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
    }

    .btn-change-avatar:hover {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }

    .meta-info {
      margin-top: 25px;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      color: #6b7280;
      background: #f9fafb;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #f3f4f6;
    }

    .meta-info div {
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .meta-info span {
      color: #374151;
      font-weight: 600;
    }

    /* CỘT PHẢI: FORM */
    .info-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #374151;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: 0.2s;
      outline: none;
      background: #fff;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .form-group input[readonly] {
      background-color: #f9fafb;
      cursor: default;
      color: #6b7280;
      border-color: #e5e7eb;
    }

    /* Nút Lưu */
    #saveBtn {
      margin-top: 15px;
      background: #10b981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }

    #saveBtn:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 35px 0;
    }

    /* --- RESPONSIVE MOBILE --- */
    @media (max-width: 768px) {
      body {
        background-size: auto 100vh;
        /* Giữ hình nền đẹp trên mobile */
      }

      .card-body {
        padding: 20px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
        /* Chuyển thành 1 cột dọc */
        gap: 30px;
      }

      .avatar-section {
        padding-right: 0;
        border-right: none;
        border-bottom: 1px dashed #e5e7eb;
        padding-bottom: 25px;
      }

      .avatar-wrapper {
        width: 140px;
        height: 140px;
      }

      /* Avatar nhỏ hơn xíu */

      /* Input trên mobile xếp dọc cho dễ nhập */
      .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .card-header h2 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div class="profile-container">
    <div class="card-profile" id="profile-content">
      <div class="card-header">
        <i class="fa-solid fa-address-card" style="font-size: 1.5rem; color: #10b981"></i>
        <h2>Hồ sơ cá nhân</h2>
      </div>

      <div class="card-body">
        <div class="profile-grid">
          <div class="avatar-section">
            <div class="avatar-wrapper">
              <a class="gallery" id = "viewAvatar">
                <img id="avatarPreview" class="avatar-img" />
              </a>
            </div>
            <label for="avatar" class="btn-change-avatar">
              <i class="fa-solid fa-camera"></i> Đổi ảnh
            </label>
            <input type="file" id="avatar" accept="image/*" style="display: none" />

            <div class="meta-info">
              <div>Ngày tham gia: <span id="createdAt">...</span></div>
              <div>Cập nhật cuối: <span id="updatedAt">...</span></div>
            </div>
          </div>

          <div class="info-section">
            <div class="form-row">
              <div class="form-group">
                <label for="username">Biệt danh</label>
                <input type="text" id="username" placeholder="Nhập biệt danh" />
              </div>
              <div class="form-group">
                <label for="role">Chức vụ</label>
                <input type="text" id="role" readonly />
              </div>
            </div>

            <div class="form-group">
              <label for="fullName">Họ và tên</label>
              <input type="text" id="fullName" placeholder="Nhập họ và tên" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" />
              </div>
              <div class="form-group">
                <label for="gender">Giới tính</label>
                <select id="gender">
                  <option value="MALE">Nam</option>
                  <option value="FEMALE">Nữ</option>
                  <option value="OTHER">Khác</option>
                </select>
              </div>
            </div>

            <button id="saveBtn">
              <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
            </button>
          </div>
        </div>

        <div class="divider"></div>
        <div id="emailsSection"></div>
      </div>
    </div>
  </div>
</body>
<script type="module" src="/profile/index.js"></script>

</html>
