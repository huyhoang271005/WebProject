<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ cá nhân</title>
    <link rel="stylesheet" href="../dialog/index.css"/>
    <link rel="stylesheet" href="../public/card.css"/>
    <link rel="stylesheet" href="../public/public.css"/>
    <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
    <style>
        .card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            gap: 5%;
        }
        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3B82F6;
        }
        .date-info {
            font-size: 0.75rem;
            color: #9CA3AF; /* xám nhạt hơn */
            margin-top: 5px;
            text-align: left;
        }
        .info {
            text-align: start;
        }
        .info label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #333;
        }
        .email-row {
            display: flex;
            align-items: center;
            gap: 3%;
            margin-bottom: 8px;
        }

        .email-input {
            flex: 1;                    /* Input chiếm phần còn lại → icon + nút có không gian */
            padding: 6px 10px;
        }

        .status-icon {
            font-size: 18px;
            line-height: 1;
        }

        .removeEmailBtn {
            padding: 6px 15px;
            margin: 8px 0;
        }

        .verify-icon {
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        /* Hover: phóng to nhẹ + sáng màu */
        .verify-icon:hover {
            transform: scale(1.15);
            opacity: 0.9;
        }

        /* Click: thu nhỏ nhẹ */
        .verify-icon:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        #addEmailBtn {
            margin-top: 5px;
        }

        @media (max-width: 700px) {
            .card {
                display: inline-block;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- Avatar -->
    <div class="avatar-wrapper">
        <img id="avatarPreview" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="avatar-img" />
        <label for="avatar" style="cursor:pointer; color:#3B82F6; margin-top: 5px;">Đổi ảnh</label>
        <input type="file" id="avatar" accept="image/*" style="display:none"/>
        <div id="emailsSection"></div>
    </div>

    <!-- Info -->
    <div class="info">
        <label for="username">Biệt danh</label>
        <input type="text" id="username" placeholder="Biệt danh" />

        <label for="fullName">Họ và tên</label>
        <input type="text" id="fullName" placeholder="Họ và tên" />

        <label for="birthday">Ngày sinh</label>
        <input type="date" id="birthday" placeholder="Ngày sinh" />

        <label for="gender">Giới tính</label>
        <select id="gender">
            <option value="MALE">Nam</option>
            <option value="FEMALE">Nữ</option>
            <option value="OTHER">Khác</option>
        </select>

        <label for="role">Chức vụ</label>
        <input type="text" id="role" placeholder="Chức vụ" readonly/>

        <div class="date-info">
            <div>Ngày tạo: <span id="createdAt">01/01/2024</span></div>
            <div>Cập nhật lần cuối: <span id="updatedAt">15/11/2025</span></div>
        </div>

        <button id="saveBtn">Cập nhật trang cá nhân</button>
    </div>
</div>
</body>
<script type="module" src="index.js"></script>
</html>
