<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phân quyền</title>
    <link rel="stylesheet" href="../dialog/index.css">
    <link rel="stylesheet" href="../public/card.css">
    <link rel="stylesheet" href="../public/public.css">
    <style>
        body {
            align-items: flex-start;
            padding: 20px;
        }
        .role {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .role-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .permission {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .delete-role-btn {
            width: 50%;
            margin: 0;
        }

        .remove-perm-btn {
            width: 15%;
            margin: 8px 0;
            padding: 10px;
        }
        .permission-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Quản lý phân quyền</h2>

    <div id="roleList"></div>

    <div style="margin-top:20px;">
        <input id="newRoleName" placeholder="Tên chức vụ mới...">
        <button id="addRoleBtn">Thêm chức vụ</button>
    </div>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
