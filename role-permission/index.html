<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Role & Permission Manager</title>
    <link rel="stylesheet" href="../dialog/index.css">
    <link rel="stylesheet" href="../public/card.css">
    <link rel="stylesheet" href="../public/public.css">
    <style>
        body {
            align-items: flex-start;
            padding: 20px;
        }
        .role {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .role-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .permission {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        button.delete {
            background: #EF4444;
        }

        button.delete:hover {
            background: #DC2626;
        }

        .permission-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Role & Permission Manager</h2>

    <div id="roleList"></div>

    <div style="margin-top:20px;">
        <input id="newRoleName" placeholder="Tên role mới...">
        <button id="addRoleBtn">Thêm Role</button>
    </div>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
