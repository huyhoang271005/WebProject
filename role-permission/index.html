<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý chức vụ</title>
    <link rel="stylesheet" href="../dialog/index.css">
    <link rel="stylesheet" href="../lib/public.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            align-items: flex-start;
            padding: 20px;
        }
        .role {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .role-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .permission {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .delete-role-btn {
            width: 50%;
            margin: 0;
        }

        .remove-perm-btn {
            margin: 8px 0;
            padding: 10px 20px;
        }
        .permission-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        #roleList {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5%;
        }
        /* ================= MOBILE RESPONSIVE ================= */
        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .card {
                width: 100%;
                padding: 15px;
            }

            /* Role list từ 2 cột -> 1 cột */
            #roleList {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .role {
                padding: 12px;
            }

            .role-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .role-header button {
                width: 100%;
            }

            /* Permission hiển thị gọn hơn */
            .permission,
            .permission-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .permission button,
            .remove-perm-btn {
                width: 100%;
            }

            /* Add role section */
            #newRoleName {
                width: 100%;
                margin-bottom: 10px;
                padding: 10px;
                box-sizing: border-box;
            }

            #addRoleBtn {
                width: 100%;
                padding: 12px;
            }

            /* Delete role button */
            .delete-role-btn {
                width: 100%;
            }
        }

    </style>
</head>
<body>

<div class="card">
    <h2>Quản lý chức vụ theo quyền</h2>
    <div id="loadPage"></div>
    <div id="info">
        <div id="roleList"></div>

        <div style="margin-top:20px;">
            <input id="newRoleName" placeholder="Tên chức vụ mới...">
            <button id="addRoleBtn">Thêm chức vụ</button>
        </div>
    </div>
</div>
</body>
<script type="module" src="/role-permission/index.js"></script>
</html>
