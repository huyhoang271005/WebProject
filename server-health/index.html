<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sức khoẻ Server - Tạp Hóa Xanh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lib/public.css">
    <style>
        body {
            /* Override public.css centering for this page specifically if needed, 
               but public.css aligns items center likely for login/small pages. 
               We might need to adjust for a dashboard. */
            display: block;
            padding-top: 100px;
            /* Offset for navbar */
            background-attachment: fixed;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header-title h1 {
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .health-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .health-card:hover {
            transform: translateY(-5px);
        }

        .health-card.up {
            border-left: 5px solid #10B981;
        }

        .health-card.down {
            border-left: 5px solid #EF4444;
        }

        .health-card.unknown {
            border-left: 5px solid #F59E0B;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #374151;
            text-transform: capitalize;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-up {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-down {
            background: #FEE2E2;
            color: #991B1B;
        }

        .status-unknown {
            background: #FEF3C7;
            color: #92400E;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #6B7280;
        }

        .metric-value {
            font-weight: 500;
            color: #111827;
        }

        /* Icon background decoration */
        .card-icon-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 5rem;
            opacity: 0.05;
            color: #000;
            transform: rotate(-15deg);
        }

        #lastUpdated {
            font-size: 0.9rem;
            color: #6B7280;
            margin-top: 5px;
        }

        .refresh-btn {
            background: #EFF6FF;
            color: #3B82F6;
            border: none;
            width: auto;
            margin: 0;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .refresh-btn:hover {
            background: #DBEAFE;
        }

        .clear-cache-btn {
            background: #FFF1F2;
            color: #E11D48;
            border: none;
            width: auto;
            margin: 0;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .clear-cache-btn:hover {
            background: #FFE4E6;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(2px);
            border-radius: 15px;
        }
    </style>
    <style>
        /* Responsive Design */
        @media screen and (max-width: 768px) {
            body {
                padding-top: 80px;
                /* Adjust for potentially smaller navbar */
            }

            .container {
                padding: 10px;
                margin-top: 20px;
                width: 100%;
                box-sizing: border-box;
            }

            .header-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 20px;
            }

            .header-title h1 {
                font-size: 1.5rem;
            }

            .header-title #lastUpdated {
                font-size: 0.8rem;
            }

            .btn-group {
                width: 100%;
                flex-direction: column;
                gap: 10px;
            }

            .refresh-btn,
            .clear-cache-btn {
                width: 100%;
                justify-content: center;
                display: flex;
                align-items: center;
                gap: 8px;
                /* space between icon and text */
            }

            /* Adjust Grid for smaller screens */
            .health-grid {
                grid-template-columns: 1fr;
                /* Stack cards vertically */
                gap: 15px;
            }

            .health-card {
                padding: 20px;
            }

            .card-icon-bg {
                font-size: 4rem;
                /* Smaller icon */
            }
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="container">
        <!-- Header -->
        <div class="header-actions">
            <div class="header-title">
                <h1><i class="fa-solid fa-server"></i> System Health</h1>
                <div id="lastUpdated"><i class="fa-regular fa-clock"></i> Cập nhật lần cuối: --:--:--</div>
            </div>
            <div class="btn-group">
                <button class="refresh-btn" id="btnRefresh" onclick="location.reload()">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
                <button class="clear-cache-btn" id="btnClearCache">
                    <i class="fa-solid fa-broom"></i> Xóa Cache Server
                </button>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="health-grid" id="healthGrid">
            <!-- Loading Skeleton -->
            <div class="card" style="grid-column: 1 / -1; text-align: center; color: #666;">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <div style="margin-top: 10px;">Đang kiểm tra tình trạng hệ thống...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/server-health/index.js"></script>
</body>

</html>
