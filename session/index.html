<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý phiên đăng nhập</title>

    <link rel="stylesheet" href="../lib/public.css" />
    <link rel="stylesheet" href="../dialog/index.css" />
    <script
      src="https://kit.fontawesome.com/e9c281dd3f.js"
      crossorigin="anonymous"
    ></script>

    <style>
      /* GIỮ NGUYÊN CSS CŨ VÀ CẬP NHẬT THÊM CÁC DÒNG NÀY: */

      .section-title {
        font-size: 0.85rem;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        margin-bottom: 12px;
        margin-top: 25px;
        text-align: left;
        letter-spacing: 0.5px;
      }

      .device-list-container {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }

      .device-card {
        display: flex;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid #e5e7eb;
        transition: background 0.2s;
      }
      .device-card:last-child {
        border-bottom: none;
      }
      .device-card:hover {
        background-color: #f9fafb;
      }

      /* Dòng đã đăng xuất thì mờ đi */
      .row-inactive {
        background-color: #f9fafb;
        opacity: 0.75;
      }
      .row-inactive:hover {
        opacity: 1;
      }

      .device-icon-wrapper {
        width: 48px;
        height: 48px;
        background-color: #f3f4f6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #4b5563;
        margin-right: 16px;
        flex-shrink: 0;
      }

      .device-details {
        flex: 1;
        text-align: left;
        overflow: hidden;
      }
      .device-name {
        font-weight: 600;
        font-size: 1rem;
        color: #111827;
        margin-bottom: 2px;
      }
      .device-meta {
        font-size: 0.85rem;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
      }

      /* --- TRẠNG THÁI (STATUS) --- */
      .status-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
        text-transform: uppercase;
        display: inline-block;
      }
      .current {
        background: #d1fae5;
        color: #065f46;
      }
      .active {
        background: #dbeafe;
        color: #1e40af;
      }
      .inactive {
        background: #f3f4f6;
        color: #6b7280;
        border: 1px solid #e5e7eb;
      }

      /* --- NÚT BẤM --- */
      .action-group {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        background: transparent;
        border: none;
        font-size: 1.1rem;
        cursor: pointer;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      /* Logout Button */
      .logout-btn {
        color: #6b7280;
      }
      .logout-btn:hover {
        color: #3b82f6;
        background: #eff6ff;
      }

      /* Delete Button */
      .delete-btn {
        color: #9ca3af;
      }
      .delete-btn:hover {
        color: #ef4444;
        background: #fef2f2;
      }

      .action-area {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-danger-outline {
        background: white;
        border: 1px solid #ef4444;
        color: #ef4444;
        font-weight: 500;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-danger-outline:hover {
        background: #fef2f2;
      }

      .btn-back {
        background: #6b7280;
        color: white;
        padding: 10px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      .btn-back:hover {
        background: #4b5563;
      }

      .device-card {
        position: relative; /* Quan trọng để định vị dòng createdAt */
        display: flex;
        align-items: center;
        padding: 20px 16px 16px 16px; /* Tăng padding top lên chút */
        border-bottom: 1px solid #e5e7eb;
        transition: background 0.2s;
      }

      .created-at-label {
        position: absolute;
        top: 5px;
        right: 10px;
        font-size: 0.65rem;
        color: #9ca3af;
        font-style: italic;
        pointer-events: none; /* Không cho chuột bấm vào */
      }

      .device-name {
        cursor: help; /* Con trỏ hình dấu hỏi hoặc mặc định */
        width: fit-content;
        /* ... các thuộc tính cũ ... */
      }

      .device-meta span.time-ago {
        cursor: help;
        border-bottom: 1px dotted #9ca3af; /* Gạch chân chấm bi nhẹ để gợi ý hover */
      }

      @media (max-width: 600px) {
        .card {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" style="max-width: 600px; width: 100%; margin: 20px auto">
      <h2 style="margin-bottom: 10px">Thiết bị</h2>
      <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 20px">
        Danh sách các thiết bị đang đăng nhập vào tài khoản của bạn.
      </p>

      <div id="loadPage"></div>

      <div id="info" style="display: none">
        <div class="section-title">Thiết bị hiện tại</div>
        <div class="device-list-container" id="currentDeviceList"></div>

        <div class="section-title">Các thiết bị khác</div>
        <div class="device-list-container" id="otherDeviceList"></div>

        <div class="action-area">
          <button id="revokeOthersBtn" class="btn-danger-outline">
            Đăng xuất tất cả thiết bị khác
          </button>
          <button class="btn-back" onclick="window.history.back()">
            Quay lại
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
