<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        #chat-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            background-color: #f9f9f9;
        }
        
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: white;
            margin-bottom: 20px;
        }
        
        .message {
            margin: 10px 0;
            padding: 8px;
            background-color: #e3f2fd;
            border-radius: 5px;
        }
        
        .message .sender {
            font-weight: bold;
            color: #1976d2;
        }
        
        .message .time {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
        }
        
        #input-container {
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1565c0;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        #status {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        
        .connected {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        
        .disconnected {
            background-color: #ffcdd2;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Simple WebSocket Chat</h2>
        
        <!-- Hiển thị trạng thái kết nối -->
        <div id="status" class="disconnected">
            Đang kết nối...
        </div>
        
        <!-- Hiển thị tin nhắn -->
        <div id="messages"></div>
        
        <!-- Nhập tin nhắn -->
        <div id="input-container">
            <input type="text" 
                   id="messageInput" 
                   placeholder="Nhập tin nhắn..." 
                   disabled>
            <button id="sendButton" onclick="sendMessage()" disabled>
                Gửi
            </button>
        </div>
    </div>

    <!-- Thư viện SockJS và STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <script>
        // Biến toàn cục
        var stompClient = null;
        var username = null;
        const API_BASE = "https://uncoagulative-tyrannisingly-eddie.ngrok-free.dev";
        // Khi trang load xong
        window.onload = function() {
            // Hỏi tên người dùng
            username = prompt("Nhập tên của bạn:");
            
            if (username) {
                // Kết nối WebSocket
                connect();
            } else {
                alert("Bạn cần nhập tên để sử dụng chat!");
            }
        };
        
        /**
         * Kết nối đến WebSocket server
         */
        function connect() {
            // Tạo SockJS connection đến endpoint đã config
            var socket = new SockJS(`${API_BASE}/websocket?ngrokSkip=2710`);
            
            // Bọc STOMP protocol lên WebSocket
            stompClient = Stomp.over(socket);
            
            // Kết nối với callback
            stompClient.connect({
                'ngrok-skip-browser-warning': '2710'
            }, onConnected, onError);
        }
        
        /**
         * Callback khi kết nối thành công
         */
        function onConnected() {
            console.log('Đã kết nối WebSocket!');
            
            // Subscribe để nhận message từ server
            stompClient.subscribe('/topic/messages', onMessageReceived);
            
            // Cập nhật UI
            document.getElementById('status').textContent = 'Đã kết nối';
            document.getElementById('status').className = 'connected';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            
            // Gửi message thông báo vào phòng
            var joinMessage = {
                sender: username,
                content: 'đã vào phòng chat',
                time: ''
            };
            stompClient.send("/app/send", {}, JSON.stringify(joinMessage));
        }
        
        /**
         * Callback khi có lỗi kết nối
         */
        function onError(error) {
            console.error('Lỗi kết nối:', error);
            document.getElementById('status').textContent = 'Lỗi kết nối!';
            document.getElementById('status').className = 'disconnected';
        }
        
        /**
         * Gửi message
         */
        function sendMessage() {
            var messageInput = document.getElementById('messageInput');
            var messageContent = messageInput.value.trim();
            
            if (messageContent && stompClient) {
                // Tạo object message
                var chatMessage = {
                    sender: username,
                    content: messageContent,
                    time: ''  // Server sẽ thêm thời gian
                };
                
                // Gửi đến server qua WebSocket
                stompClient.send("/app/send", {}, JSON.stringify(chatMessage));
                
                // Xóa input
                messageInput.value = '';
            }
        }
        
        /**
         * Nhận message từ server
         */
        function onMessageReceived(payload) {
            // Parse JSON từ server
            var message = JSON.parse(payload.body);
            
            // Tạo element để hiển thị
            var messageElement = document.createElement('div');
            messageElement.className = 'message';
            
            messageElement.innerHTML = 
                '<span class="sender">' + message.sender + '</span>' +
                '<span class="time">' + message.time + '</span>' +
                '<div>' + message.content + '</div>';
            
            // Thêm vào khung chat
            var messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(messageElement);
            
            // Auto scroll xuống tin nhắn mới nhất
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Cho phép gửi bằng phím Enter
        document.addEventListener('DOMContentLoaded', function() {
            var input = document.getElementById('messageInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
