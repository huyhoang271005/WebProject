<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chi tiết người dùng</title>
<link rel="stylesheet" href="../dialog/index.css"/>
<link rel="stylesheet" href="../public/public.css"/>
<script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
<style>
.profile {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto;
    gap: 5%;
}
.avatar-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 15px;
}
.avatar-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #3B82F6;
}
.info {
    text-align: start;
}
.info label {
    font-weight: 500;
    font-size: 0.9rem;
    color: #333;
}
.info>div {
    margin-bottom: 8px;
    padding: 6px 0;
    width: 100%;
    box-sizing: border-box;
}
.email-row {
    display: flex;
    align-items: center;
    gap: 3%;
    margin-bottom: 8px;
}

.email-input {
    flex: 1;                    /* Input chiếm phần còn lại → icon + nút có không gian */
    padding: 6px 10px;
}

.status-icon {
    font-size: 18px;
    line-height: 1;
}

.verify-icon {
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
}

/* Hover: phóng to nhẹ + sáng màu */
.verify-icon:hover {
    transform: scale(1.15);
    opacity: 0.9;
}

/* Click: thu nhỏ nhẹ */
.verify-icon:active {
    transform: scale(0.9);
    opacity: 0.7;
}

#addEmailBtn {
    margin-top: 5px;
}
.date-info {
    font-size: 0.75rem;
    color: #9CA3AF;
    margin-top: 5px;
}
@media (max-width:700px){
    .profile { display: inline-block; }
}
</style>
</head>
<body>
<div class="card">
    <h2>Chi tiết người dùng</h2>
    <div id="loadPage"></div>

    <div id="info">
        <div class="profile">
            <!-- Email bên trái -->
            <div class="avatar-wrapper">
                <img id="avatarPreview" src="" class="avatar-img" />
                <div id="emailsSection"></div>
            </div>

            <!-- Thông tin user -->
            <div class="info">
                <label>Biệt danh</label>
                <div id="username"></div>

                <label>Họ và tên</label>
                <div id="fullName"></div>

                <label>Ngày sinh</label>
                <div id="birthday"></div>

                <label>Giới tính</label>
                <div id="gender"></div>

                <div class="date-info">
                    <div>Ngày tham gia: <span id="createdAt"></span></div>
                </div>
                <!-- Admin-only fields -->
                <div id="adminFields" style="margin-top:10px;">
                    <label>Chức vụ</label>
                    <select id="roleSelect"></select>

                    <label>Status</label>
                    <select id="statusSelect"></select>
                    <button id = "btnUpdate">Cập nhật</button>
                    <button id = "btnLogout" class = "delete">Đăng xuất người dùng trên tất cả thiết bị</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
