<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chi tiết người dùng</title>
  <link rel="stylesheet" href="/lib/public.css" />
  <link rel="stylesheet" href="../dialog/index.css" />
  <script src="https://kit.fontawesome.com/e9c281dd3f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
  <style>
    /* Override public.css min-width conflict */
    input,
    select {
      min-width: 0 !important;
    }

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      color: #374151;
      padding-top: 80px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .profile-container {
      width: 100%;
      max-width: 1000px;
      padding: 40px 20px;
    }

    .card-detail {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      padding: 20px 30px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: #111827;
      font-weight: 700;
    }

    .card-body {
      padding: 30px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
    }

    /* Cột Trái */
    .left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px dashed #e5e7eb;
      padding-right: 20px;
    }

    .avatar-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .avatar-img:hover {
      transform: scale(1.02);
    }

    .action-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }

    /* Cột Phải */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .info-label {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 1rem;
      color: #111827;
      font-weight: 500;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    /* Admin Area (Đã xóa tiêu đề) */
    .admin-section {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      margin-top: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-update {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-update:hover {
      background: #059669;
    }

    .btn-logout {
      background: #fff;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 10px;
    }

    .btn-logout:hover {
      background: #fef2f2;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 30px 0;
    }

    /* Modal */
    #notiModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }

    .noti-box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: popIn 0.3s;
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .noti-box input,
    .noti-box textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      font-family: inherit;
    }

    .noti-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    #btnSendNotification, #btnSendMessage {
      display: none;
    }

    @media (max-width: 768px) {
      .detail-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .left-col {
        border-right: none;
        border-bottom: 1px dashed #e5e7eb;
        padding-bottom: 20px;
        padding-right: 0;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .btn-logout {
        margin-left: 0;
        margin-top: 10px;
        width: 100%;
      }

      .btn-update {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="notiModal">
    <div class="noti-box">
      <h3 style="margin-top: 0; color: #111827">Gửi thông báo</h3>
      <input type="text" id="notiTitle" placeholder="Tiêu đề thông báo" />
      <textarea id="notiContent" rows="4" placeholder="Nội dung thông báo..."></textarea>
      <div class="noti-actions">
        <button class="btn-secondary" onclick="closeNotiModal()" style="width: auto; padding: 8px 15px">
          Hủy
        </button>
        <button class="btn-primary" id="confirmSendNoti" style="width: auto; padding: 8px 15px">
          Gửi ngay
        </button>
      </div>
    </div>
  </div>

  <div class="profile-container">
    <div id="loadPage"></div>

    <div class="card-detail" id="user-detail-content">
      <div class="card-header">
        <h2>
          <i class="fa-solid fa-address-book" style="color: #10b981"></i>
          Thông tin chi tiết
        </h2>
      </div>

      <div class="card-body">
        <div class="detail-grid">
          <div class="left-col">
            <a class="gallery" id="viewAvatar">
              <img id="avatarPreview" src="" class="avatar-img" />
            </a>
            <div class="action-buttons">
              <button id="btnSendMessage" class="btn-action btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Nhắn tin
              </button>
              <button id="btnSendNotification" class="btn-action btn-secondary">
                <i class="fa-solid fa-bell"></i> Gửi thông báo
              </button>
            </div>
          </div>

          <div class="right-col">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
              <div class="info-group">
                <span class="info-label">Biệt danh</span>
                <div class="info-value" id="username">...</div>
              </div>
              <div class="info-group">
                <span class="info-label">Họ và tên</span>
                <div class="info-value" id="fullName">...</div>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
              <div class="info-group">
                <span class="info-label">Ngày sinh</span>
                <div class="info-value" id="birthday">...</div>
              </div>
              <div class="info-group">
                <span class="info-label">Giới tính</span>
                <div class="info-value" id="gender">...</div>
              </div>
            </div>

            <div class="info-group">
              <span class="info-label">Ngày tham gia</span>
              <div class="info-value" id="createdAt">...</div>
            </div>

            <div id="adminFields" class="admin-section" style="display: none">
              <div class="form-row">
                <div>
                  <label style="
                        font-size: 0.85rem;
                        font-weight: 600;
                        margin-bottom: 5px;
                        display: block;
                      ">Chức vụ (Role)</label>
                  <select id="roleSelect"></select>
                </div>
                <div>
                  <label style="
                        font-size: 0.85rem;
                        font-weight: 600;
                        margin-bottom: 5px;
                        display: block;
                      ">Trạng thái (Status)</label>
                  <select id="statusSelect"></select>
                </div>
              </div>

              <div style="display: flex; flex-wrap: wrap; align-items: center">
                <button id="btnUpdate" class="btn-update">
                  <i class="fa-solid fa-rotate"></i> Cập nhật
                </button>
                <button id="btnLogout" class="btn-logout">
                  <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                  người dùng
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div id="emailsSection"></div>
      </div>
    </div>
  </div>

  <script>
    function closeNotiModal() {
      document.getElementById("notiModal").style.display = "none";
    }
  </script>
  <script type="module" src="/user-detail/index.js"></script>
</body>

</html>
