<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" href="../dialog/index.css">
    <link rel="stylesheet" href="../public/card.css">
    <link rel="stylesheet" href="../public/public.css">
</head>
<style>
    td {
        margin: 5px;
    }
</style>
<body>

<div class="card">
    <h2>Quản lý người dùng</h2>

    <div id="loading">Đang tải dữ liệu...</div>

    <table id="userTable" style="display:none; width:100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Chức vụ</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dữ liệu người dùng sẽ render ở đây -->
        </tbody>
    </table>
</div>

<script type="module">
    // Giả lập dữ liệu người dùng
    let users = [
        { id: 1, name: "Nguyễn Văn A", email: "a@example.com", role: "user" },
        { id: 2, name: "Trần Thị B", email: "b@example.com", role: "admin" },
        { id: 3, name: "Lê Văn C", email: "c@example.com", role: "moderator" },
    ];

    const roles = ["user", "moderator", "admin"];

    function renderUsers() {
        const tbody = document.querySelector("#userTable tbody");
        tbody.innerHTML = "";

        users.forEach(user => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>
                    <select id="role-${user.id}">
                        ${roles.map(r => `<option value="${r}" ${r===user.role ? "selected" : ""}>${r}</option>`).join('')}
                    </select>
                </td>
                <td>
                    <button onclick="updateRole(${user.id})">Cập nhật</button>
                    <button class="delete" onclick="deleteUser(${user.id})">Xóa</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateRole(userId) {
        const select = document.getElementById(`role-${userId}`);
        const newRole = select.value;
        const user = users.find(u => u.id === userId);
        user.role = newRole;
        console.log(`Cập nhật role của ${user.name} thành ${newRole}`);
        // Nếu có API: fetch(`/api/users/${userId}/role`, { method:'PUT', body: JSON.stringify({role:newRole})})
    }

    function deleteUser(userId) {
        users = users.filter(u => u.id !== userId);
        renderUsers();
        console.log(`Đã xóa user ${userId}`);
        // Nếu có API: fetch(`/api/users/${userId}`, { method:'DELETE' })
    }

    window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => { // Giả lập delay load
            renderUsers();
            document.getElementById("loading").style.display = "none";
            document.getElementById("userTable").style.display = "table";
        }, 500);
    });
</script>

</body>
</html>
